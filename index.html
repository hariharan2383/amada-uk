<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMADA Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --red:#FC1B1C; --red-soft:#FFE9E9; --ink:#000; --paper:#fff;
  --fill:#F4F4F4; --fill2:#EAEAEA; --muted:#6B6B6B; --faint:#A3A3A3; --line:rgba(0,0,0,.08);
  --ease:cubic-bezier(0.2,0,0,1);
  --side:236px;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;letter-spacing:-0.02em;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}

/* Sidebar */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:#000;color:#fff;display:flex;flex-direction:column;z-index:30;padding:22px 12px 16px}
.brand{padding:0 12px 26px;display:flex;align-items:baseline;gap:8px}
.brand b{color:var(--red);font-size:21px;font-weight:700;letter-spacing:-0.01em}
.brand span{color:rgba(255,255,255,.55);font-size:13px}
.navgroup{margin-bottom:18px}
.navgroup h6{margin:0 0 4px;padding:0 12px;font-size:12px;font-weight:500;color:rgba(255,255,255,.38)}
.navitem{position:relative;display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 12px;border-radius:9px;color:rgba(255,255,255,.62);transition:color 120ms, background-color 120ms}
.navitem:hover{color:#fff;background:rgba(255,255,255,.06)}
.navitem.on{color:#fff;background:rgba(255,255,255,.1)}
.navitem.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.navitem em{font-style:normal;font-size:12px;color:rgba(255,255,255,.45)}
.navitem.on em{color:rgba(255,255,255,.8)}
.side .foot{margin-top:auto;padding:12px;font-size:12px;color:rgba(255,255,255,.4)}
.side .foot button{background:none;border:0;padding:0;color:rgba(255,255,255,.6);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Main */
.main{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:16px;padding:0 40px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:linear-gradient(rgba(0,0,0,.035),transparent);pointer-events:none;opacity:var(--edge,0);transition:opacity 150ms}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0;flex:1;white-space:nowrap;overflow:hidden}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--faint)}
.crumbs .cur{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.top .who{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.demo{font-size:12px;color:var(--muted);background:var(--fill);padding:5px 10px;border-radius:99px}
.top .menu-btn{display:none}
.page{padding:28px 40px 96px;max-width:1360px}

/* Type */
h1{font-size:32px;line-height:1.1;font-weight:600;letter-spacing:-0.035em;margin:0}
h2{font-size:19px;line-height:1.25;font-weight:600;letter-spacing:-0.03em;margin:0}
h3{font-size:15px;font-weight:600;letter-spacing:-0.02em;margin:0}
.sub{color:var(--muted);margin-top:6px;font-size:14px}
.small{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.red{color:var(--red)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}
.section{margin-top:40px}
.section > .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:12px}
.section > .sh a{font-size:13px;color:var(--muted)}
.section > .sh a:hover{color:var(--ink)}

/* Surfaces */
.well{background:var(--fill);border-radius:16px;padding:22px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g-main{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g-side{grid-template-columns:minmax(0,1fr) 360px}

/* Stats band */
.stats{display:grid;grid-template-columns:repeat(var(--n,4),1fr);background:var(--fill);border-radius:16px}
.stat{padding:20px 22px;position:relative}
.stat + .stat::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:1px;background:var(--line)}
.stat .v{font-size:28px;font-weight:600;letter-spacing:-0.04em;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted);margin-top:4px}
.stat .d{font-size:12px;margin-top:8px;color:var(--muted)}

/* Flow band (overview hero) */
.flow{display:grid;grid-template-columns:repeat(5,1fr);position:relative;margin:8px 0 0}
.flow::before{content:"";position:absolute;left:10%;right:10%;top:65px;height:2px;background:rgba(0,0,0,.14)}
.flow .node{position:relative;text-align:center;padding:0 8px;cursor:pointer}
.flow .node .pin{width:12px;height:12px;border-radius:50%;background:var(--ink);margin:16px auto 18px;box-shadow:0 0 0 6px var(--fill);position:relative}
.flow .node.hot .pin{background:var(--red)}
.flow .node .v{font-size:44px;font-weight:600;letter-spacing:-0.05em;line-height:1}
.flow .node .l{font-size:14px;margin-top:8px}
.flow .node .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.flow .node:hover .l{text-decoration:underline;text-underline-offset:3px}

/* Tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:left;padding:0 12px 10px;white-space:nowrap}
.tbl td{padding:14px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--fill)}
.tbl tr.click:hover td:first-child{border-radius:10px 0 0 10px}
.tbl tr.click:hover td:last-child{border-radius:0 10px 10px 0}
.tbl tr.click:hover td,.tbl tr.click:hover + tr td{border-top-color:transparent}
.tbl .r{text-align:right}
.tbl td .t{font-weight:500}
.tbl td .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.tbl-wrap{overflow-x:auto}
.well .tbl td{border-top-color:rgba(0,0,0,.07)}

/* Status */
.st{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;flex:none;background:#C4C4C4}
.st.crit i{background:var(--red)}
.st.crit{color:var(--red)}
.st.warn i{background:transparent;box-shadow:inset 0 0 0 1.6px var(--red)}
.st.ok i{background:var(--ink)}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--fill);white-space:nowrap}
.chip.red{background:var(--red-soft);color:#C40010}
.chip.dark{background:var(--ink);color:#fff}

/* Buttons */
.btn{height:36px;padding:0 16px;border-radius:10px;border:0;background:var(--fill);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition-property:scale,background-color,opacity;transition-duration:100ms,120ms,120ms;transition-timing-function:ease-out}
.btn:hover{background:var(--fill2)}
.btn:active{scale:.96}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{background:#E0000F}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#262626}
.btn.ghost{background:transparent;padding:0 10px}
.btn.ghost:hover{background:var(--fill)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.sm{height:30px;padding:0 12px;border-radius:8px;font-size:13px}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:rgba(0,0,0,.25);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--ink)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}

/* Segmented */
.seg{display:inline-flex;background:var(--fill);border-radius:11px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 14px;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-weight:500;transition:background-color 150ms,color 150ms}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04)}

/* Inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--muted)}
.input,select.input,textarea.input{height:38px;border:0;border-radius:10px;background:var(--fill);padding:0 12px;outline:none;transition:box-shadow 120ms}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus{box-shadow:inset 0 0 0 1.5px var(--ink);background:#fff}
.input.bad{box-shadow:inset 0 0 0 1.5px var(--red)}
.err{font-size:12px;color:var(--red)}
.search{width:260px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check .box{width:18px;height:18px;border-radius:5px;background:#fff;box-shadow:inset 0 0 0 1.5px #BDBDBD;flex:none;margin-top:1px;display:grid;place-items:center;transition:background-color 120ms,box-shadow 120ms}
.check.done .box{background:var(--ink);box-shadow:none}
.check.done .box::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.check.auto{cursor:default}
.check .ct{font-weight:500}
.check .cd{font-size:12.5px;color:var(--muted);margin-top:2px}
.toggle{width:38px;height:22px;border-radius:99px;background:#D6D6D6;position:relative;border:0;cursor:pointer;flex:none;transition:background-color 150ms}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform 200ms var(--ease)}
.toggle.on{background:var(--ink)}
.toggle.on::after{transform:translateX(16px)}

/* Key-value */
.kv{display:grid;grid-template-columns:150px 1fr;gap:10px 16px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0}
.rows > div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line)}
.rows > div:first-child{border-top:0}
.rows > div.total{font-weight:600;font-size:16px}

/* Stepper */
.stepper{display:flex;margin:24px 0 32px;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:110px;position:relative;padding-top:22px;font-size:13px;color:var(--faint);background:none;border:0;text-align:left;cursor:default}
.step::before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:var(--fill2)}
.step.done::before{background:var(--ink)}
.step.cur::before{background:linear-gradient(90deg,var(--red) 0 50%,var(--fill2) 50%)}
.step .dotp{position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;background:var(--fill2);box-shadow:0 0 0 3px #fff}
.step.done .dotp{background:var(--ink)}
.step.cur .dotp{background:var(--red)}
.step.done,.step.cur{color:var(--ink);cursor:pointer}
.step.view{font-weight:600}
.step .n{display:block;font-size:12px;color:var(--faint);font-weight:400}

/* Email */
.mail .from{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}
.mail .body{white-space:pre-wrap;line-height:1.6}
.attach{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.attach span{background:#fff;padding:7px 12px;border-radius:9px;font-size:13px}

/* Confidence */
.conf{font-size:12px;color:var(--muted)}
.conf.missing{color:var(--red)}

/* Bars */
.bar{height:6px;background:var(--fill2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.bar.hot i{background:var(--red)}
.load{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:10px;align-items:end}
.load .col{display:flex;flex-direction:column;gap:10px}
.load .tube{height:120px;width:28px;background:#fff;border-radius:8px;position:relative;overflow:hidden}
.load .tube i{position:absolute;left:0;right:0;bottom:0;background:var(--ink);border-radius:8px;transition:height 400ms var(--ease)}
.load .col.hot .tube i{background:var(--red)}
.load .lab{font-size:12.5px;line-height:1.3}
.load .lab b{display:block;font-size:18px;font-weight:600;letter-spacing:-0.03em}

/* Alerts list */
.alist > a,.alist > div{display:grid;grid-template-columns:14px 1fr auto;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.alist > :first-child{border-top:0}
.alist > a:hover .at{text-decoration:underline;text-underline-offset:3px}
.alist .st{margin-top:6px}
.alist .at{font-weight:500}
.alist .ad{font-size:12.5px;color:var(--muted);margin-top:2px}

/* Stage insights */
.insights{background:var(--fill);border-radius:16px;padding:16px 20px 6px;margin:-8px 0 28px}
.insights .ih{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.insights .ins{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid rgba(0,0,0,.06)}
.insights .ih + .ins{border-top:0}
.insights .ins .st{margin-top:6px}
.insights .it{font-weight:500}
.insights .id{font-size:12.5px;color:var(--muted);margin-top:1px}
/* Recommendation */
.rec{padding:16px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0;padding-top:0}
.rec .why{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.rec .acts{margin-top:10px;display:flex;gap:8px}

/* Drawer & dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;transition:opacity 260ms var(--ease);z-index:50}
.scrim.show{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#fff;z-index:51;transform:translateX(100%);transition:transform 320ms var(--ease);box-shadow:-24px 0 64px rgba(0,0,0,.14);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.show{transform:none}
.drawer .dh{padding:24px 28px 16px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.drawer .db{padding:4px 28px 32px;overflow-y:auto;flex:1}
.drawer .df{padding:14px 28px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;background:var(--fill)}
.dialog{position:fixed;left:50%;top:50%;width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 64px);overflow:auto;background:#fff;border-radius:20px;z-index:51;transform:translate(-50%,-48%) scale(.96);opacity:0;transition:transform 240ms var(--ease),opacity 200ms var(--ease);box-shadow:0 24px 80px rgba(0,0,0,.22)}
.dialog.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.dialog .dh{padding:24px 28px 8px}
.dialog .db{padding:12px 28px 8px}
.dialog .df{padding:16px 28px 24px;display:flex;justify-content:flex-end;gap:8px}
.x{width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);cursor:pointer;position:relative;flex:none}
.x::before,.x::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.6px;background:var(--ink);border-radius:2px}
.x::before{transform:translate(-50%,-50%) rotate(45deg)}
.x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.x:active{scale:.96}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;opacity:0;transition:transform 260ms var(--ease),opacity 200ms;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--fill2)}
.tl > div{position:relative;padding:0 0 18px}
.tl > div::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--fill2);box-shadow:0 0 0 3px #fff}
.tl > div.done::before{background:var(--ink)}
.tl > div.cur::before{background:var(--red)}
.tl .tt{font-weight:500}
.tl .td{font-size:12.5px;color:var(--muted)}

/* Quote document */
.doc{background:#fff;border-radius:12px;padding:36px 40px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 32px rgba(0,0,0,.06)}
.doc .brandline{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}
.doc .brandline b{color:var(--red);font-size:22px;letter-spacing:-0.01em}
.doc table{width:100%;border-collapse:collapse;margin-top:14px}
.doc td,.doc th{padding:9px 0;border-top:1px solid var(--line);text-align:left;font-size:13px}
.doc th{font-weight:500;color:var(--muted);border-top:0}
.doc .r{text-align:right}

.empty{padding:40px 0;text-align:center;color:var(--muted)}
.cat-row{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:26px 0;border-top:1px solid var(--line)}
.cat-row:first-child{border-top:0;padding-top:4px}
.models{display:flex;flex-wrap:wrap;gap:8px}
.models a{background:var(--fill);padding:8px 14px;border-radius:10px;font-weight:500;transition:background-color 120ms}
.models a:hover{background:var(--fill2)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.inline-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{height:24px}
hr.soft{border:0;height:1px;background:var(--line);margin:20px 0}

@media (max-width:1100px){.g-main,.g-side,.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .side{transform:translateX(-100%);transition:transform 300ms var(--ease)}
  .side.open{transform:none}
  .main{margin-left:0}
  .top .menu-btn{display:inline-flex}
  .top,.page{padding-left:20px;padding-right:20px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(3)::before{display:none}
  .flow{grid-template-columns:1fr 1fr 1fr}
  .flow::before{display:none}
  .g3{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .cat-row{grid-template-columns:1fr}
  .search{width:100%}
  .demo{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms !important}
  .drawer{transform:none;opacity:0;transition:opacity 200ms !important}
  .drawer.show{opacity:1}
}
</style>
</head>
<body>
<aside class="side" id="side"></aside>
<div class="main">
  <header class="top" id="top"></header>
  <main class="page" id="view"></main>
</div>
<div id="layer"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   VALIDATED PRODUCT DATA — sourced from amada.eu/uk-en (Sep 2026)
   Only specs found on AMADA's own pages are included.
   ========================================================= */
const SRC = 'https://www.amada.eu/uk-en/products/products/';
const SM = SRC + 'sheet-metal-machines-and-automation/';
const PLANTS = {
  CHV: { id:'CHV', name:'Charleville-Mézières', country:'France', scope:'Laser cutting and punching machines, robotic bending cell integration, European machine stock hub' },
  CDL: { id:'CDL', name:'Château-du-Loir', country:'France', scope:'Bending machines' }
};

/* Enquiry derived values */
function slaState(e){
  if(e.stage>=STAGES.length) return {lvl:'ok',txt:'Done'};
  const sla=STAGES[e.stage].sla; const used=e.hoursIn||0; const left=sla-used;
  if(left<0) return {lvl:'crit',txt:'Overdue '+Math.abs(Math.round(left))+'h',left};
  if(left<sla*0.25) return {lvl:'warn',txt:Math.round(left*10)/10+'h left',left};
  return {lvl:'ok',txt:Math.round(left)+'h left',left};
}
function cfgOf(e){
  const m=MODEL[e.match.model]; const c=catOf(e.match.model);
  e.cfg = e.cfg || { range: e.match.range ?? 0, power: e.match.power ?? (m.power? m.power[0]:null), auto: !!e.match.auto, software:true, training:true, install:true, finance: !!e.match.finance, variant: e.match.variant||null };
  return {m,c,cfg:e.cfg};
}
function lines(e){
  const {m,c,cfg}=cfgOf(e);
  const PB=S.md.prices; const pb=PB[m.id]||[0,0];
  const out=[];
  let name=m.name, detail=[];
  if(m.ranges){ const r=m.ranges[cfg.range]||m.ranges[0]; detail.push('Working range '+rangeLabel(r)); }
  if(cfg.power) detail.push(cfg.power+' kW fibre');
  if(cfg.variant) detail.push(cfg.variant);
  const extraKw = (m.power && cfg.power)? Math.max(0,cfg.power-m.power[0]) : 0;
  const rangeUplift = m.ranges && cfg.range? cfg.range*42000 : 0;
  out.push({grp:'Machine',item:name,detail:detail.join(', '),list:pb[0]+pb[1]*extraKw+rangeUplift,src:m.url});
  if(cfg.auto && c.automation){ out.push({grp:'Automation',item:c.automation,detail:'Loading and unloading, sized to working range',list:c.key==='punch'?PB.auto_punch:PB.auto_laser,src:c.url.replace(/[^/]+$/,'automated-machines')}); }
  if(cfg.software) out.push({grp:'Software',item:'AMADA '+({laser:'laser cutting',punch:'punching',combi:'punch/laser combination',bend:'bending',weld:'welding'}[c.key])+' software',detail:'CAD/CAM programming seat',list:PB.software,src:SRC+'software'});
  if(cfg.install) out.push({grp:'Services',item:'Delivery and installation',detail:'Rigging, installation and commissioning',list:PB.install,src:null});
  if(cfg.training) out.push({grp:'Services',item:'Training courses',detail:'Operator and programmer training',list:PB.training,src:'https://www.amada.eu/uk-en/services/training-courses'});
  return out;
}
function pricing(e){
  const ls=lines(e); const list=ls.reduce((a,l)=>a+l.list,0);
  if(e.snap) return e.snap;
  const disc=e.discount??0; const net=list*(1-disc/100); const R_=S.md.rules;
  ls.forEach(l=>{ l.net=l.list*(1-disc/100); l.cost=l.list*((l.grp==='Services'?R_.costService:R_.costMachine)/100); l.contrib=l.net-l.cost; });
  const cost=ls.reduce((a,l)=>a+l.cost,0); const margin=(net-cost)/net*100;
  return {ls,list,disc,net,cost,margin};
}
function feasibility(e){
  const {m,cfg}=cfgOf(e); const ck=e.checks||{};
  const auto=[];
  const reqSheet = (e.req['Sheet size']&&e.req['Sheet size'].v.match(/(\d{4})\s*×\s*(\d{4})/)) || null;
  if(m.ranges && reqSheet){
    const r=m.ranges[cfg.range]||m.ranges[0]; const okFit = +reqSheet[1]<=r[0] && +reqSheet[2]<=r[1];
    auto.push({ok:okFit,t:'Sheet size fits working range',d:`Customer ${reqSheet[1]} × ${reqSheet[2]} mm against ${rangeLabel(r)} on the ${m.name} catalogue page`});
  }
  if(m.power && cfg.power){
    const inR = cfg.power>=m.power[0] && cfg.power<=m.power[1] && (!m.powerSteps || m.powerSteps.includes(+cfg.power));
    auto.push({ok:inR,t:'Laser power offered for this model',d:`${cfg.power} kW against ${m.powerSteps? m.powerSteps.join(', ')+' kW' : m.power[0]+' to '+m.power[1]+' kW'} published for ${m.name}`});
  }
  if(cfg.auto){ const c=catOf(m.id); auto.push({ok:!!(m.auto||c.key!=='laser'),t:'Automation listed for this model',d: m.auto? `${m.name} appears under ${c.automation}` : `Check ${c.automation} options for ${m.name}`}); }
  const manual=[
    {k:'sample',t:'Sample parts tested at technical centre',d:'Run the customer\u2019s parts and share the test report'},
    {k:'site',t:'Site survey completed',d:'Floor space, access route, foundation'},
    {k:'power',t:'Electrical supply confirmed',d:'Supply rating confirmed by customer'},
    {k:'slot',t:'Supply route confirmed',d:'Stock at Charleville-Mézières hub or build slot reserved'}
  ].map(x=>({...x,ok:!!ck[x.k]}));
  return {auto,manual,done: auto.every(a=>a.ok) && manual.every(x=>x.ok)};
}
function supplyFor(e){
  const {m,c}=cfgOf(e); const plant=PLANTS[c.plant]; const stock=MACHINE_STOCK.find(s=>s.model===m.id);
  const free = stock? stock.avail-stock.alloc : 0;
  const lead = free>0? 3 : (c.plant==='CDL'? 9 : 12);
  return {plant,stock,free,lead,delivery:addDays(TODAY,lead*7)};
}
function orderRisk(o){
  const b=buildFor(o.id);
  if(b && b.risk!=='ok') return {lvl:b.risk, why:b.reason, slip:dayDiff(b.due,b.pred)};
  if(o.status==='In transit') { const sh=SHIPMENTS.find(s=>s.order===o.id); if(sh && sh.arrive>o.promise) return {lvl:'warn',why:'Arrives '+dt(sh.arrive)+', after promised '+dt(o.promise)+'.',slip:dayDiff(o.promise,sh.arrive)}; }
  return {lvl:'ok',why:'',slip:0};
}

/* =========================================================
   LAYERS (drawer / dialog)
   ========================================================= */
function openLayer(kind, html, onMount){
  const L=$('#layer');
  L.innerHTML=`<div class="scrim"></div><div class="${kind}" role="dialog" aria-modal="true">${html}</div>`;
  const sc=L.querySelector('.scrim'), p=L.querySelector('.'+kind);
  requestAnimationFrame(()=>{ sc.classList.add('show'); p.classList.add('show'); });
  sc.onclick=closeLayer; L.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeLayer);
  document.onkeydown=e=>{ if(e.key==='Escape') closeLayer(); };
  onMount && onMount(p);
  const f=p.querySelector('input,select,textarea,button:not(.x)'); f&&setTimeout(()=>f.focus({preventScroll:true}),60);
}
function closeLayer(){
  const L=$('#layer'); const sc=L.querySelector('.scrim'), p=L.querySelector('.drawer,.dialog');
  if(!p) return; sc.classList.remove('show'); p.classList.remove('show'); document.onkeydown=null;
  setTimeout(()=>{ L.innerHTML=''; },320);
}

function PlantLoadMini(p){

    ${wc.map(w=>`<div style="display:grid;grid-template-columns:1fr 120px 40px;gap:12px;align-items:center;padding:5px 0"><span class="small" style="color:var(--ink)">${w[0]}</span><div class="bar ${w[2]>=95?'hot':''}"><i style="width:${w[2]}%"></i></div><span class="small num" style="text-align:right">${w[2]}%</span></div>`).join('')}
    <div class="note" style="margin-top:12px">${top[2]>=95? `<span class="red">${top[0]}</span> is the constraint at ${top[2]}%.` : `Highest load: ${top[0]} at ${top[2]}%.`}</div></a>`;
}
function Recommendations(){
  const recs=[]; const push=(plant,html)=>{ const o=new String(html); o.plant=plant; recs.push(o); };
  const b1=S.builds.find(b=>b.id==='BO-26-1142');
  if(b1 && b1.risk==='crit') push('CHV',`<div class="rec"><div class="at" style="font-weight:500">Resequence integration at Charleville-Mézières</div><div class="why">BO-26-1142 waits for a 9 kW oscillator due 5 Oct. Stock build BO-26-1144 already holds one. Swapping the module keeps SO-2026-0412 on its 16 Nov promise; the stock build absorbs the delay.</div><div class="acts"><button class="btn sm dark" data-act="apply-rec" data-id="swap">Apply swap</button><a class="btn sm" href="#/orders/SO-2026-0412">View order</a></div></div>`);
  push('COM',`<div class="rec"><div style="font-weight:500">Offer stock ENSIS-3015AJe to Hallam Precision</div><div class="why">ENQ-2026-0481 asks for a 9 kW, 3015 fibre laser before Q1. One matching machine is unallocated at the Charleville-Mézières hub, which shortens lead time from about 12 weeks to 3.</div><div class="acts"><a class="btn sm dark" href="#/enquiries/ENQ-2026-0481">Open enquiry</a></div></div>`);
  const b2=S.builds.find(b=>b.id==='BO-26-1131');
  if(b2 && b2.risk==='crit') push('CDL',`<div class="rec"><div style="font-weight:500">Tell Pennine Kiosk about a 6-day slip</div><div class="why">HG build BO-26-1131 failed its bending angle run-off test. Recalibration moves dispatch to 24 Sep and installation to 1 Oct. Early notice lets the customer re-plan.</div><div class="acts"><button class="btn sm dark" data-act="draft-notice" data-order="SO-2026-0396">Draft update</button></div></div>`);
  push('CDL',`<div class="rec"><div style="font-weight:500">Raise purchase for servo press drives</div><div class="why">Château-du-Loir has 2 on hand against 4 needed in the next 4 weeks and nothing inbound. EGB-e and EGB-ATCe builds will stop at mechanical assembly without them.</div><div class="acts"><a class="btn sm dark" href="#/supply/components">Review components</a></div></div>`);
  return recs;
}

/* =========================================================

function EnquiryList(){
  const f=S.ui.enqFilter, q=(S.ui.q||'').toLowerCase();

  const counts={all:list.length,new:list.filter(e=>e.stage===0).length,progress:list.filter(e=>e.stage>0&&e.stage<5).length,quoted:list.filter(e=>e.stage>=5).length};
  if(f==='new') list=list.filter(e=>e.stage===0); if(f==='progress') list=list.filter(e=>e.stage>0&&e.stage<5); if(f==='quoted') list=list.filter(e=>e.stage>=5);
  if(q) list=list.filter(e=>(e.id+CUST[e.cust].name+e.subject+MODEL[e.match.model].name).toLowerCase().includes(q));
  return `
  <div class="head"><div><h1>Enquiries</h1><div class="sub">Every request from first email to purchase order, with its stage and SLA.</div></div>
    <div class="actions"><button class="btn primary" data-act="new-enq">Log enquiry</button></div></div>
  <div class="inline-actions" style="justify-content:space-between;margin-bottom:18px">
    <div class="seg" role="tablist">${[['all','All'],['new','New'],['progress','In progress'],['quoted','Quoted']].map(([k,l])=>`<button class="${f===k?'on':''}" data-filter="${k}">${l} <span class="num muted">${counts[k]}</span></button>`).join('')}</div>
    <input class="input search" id="q" placeholder="Search customer, model or ID" value="${esc(S.ui.q||'')}">
  </div>
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Customer</th><th>Request</th><th>Suggested machine</th><th>Stage</th><th>Owner</th><th>SLA</th><th class="r">Received</th></tr></thead>
    <tbody>${list.map(e=>{const s=slaState(e);return `<tr class="click" data-href="#/enquiries/${e.id}">
      <td><div class="t">${esc(CUST[e.cust].name)}</div><div class="s">${esc(CUST[e.cust].city)}, ${esc(CUST[e.cust].country)}</div></td>
      <td style="max-width:360px"><div class="t">${esc(e.subject)}</div><div class="s">${e.id}</div></td>
      <td>${esc(MODEL[e.match.model].name)}</td>
      <td>${e.stage>=7?'Ordered':STAGES[e.stage].label}${e.stage===5&&e.sent?'<div class="s">Sent '+dt(e.sent)+'</div>':''}</td>
      <td>${e.owner?esc(e.owner):'<span class="muted">Unassigned</span>'}</td>
      <td>${st(s.lvl,s.txt)}</td>
      <td class="r num">${dt(e.at)}<div class="s">${tm(e.at)}</div></td></tr>`}).join('')||`<tr><td colspan="7"><div class="empty">No enquiries match. Try a different filter.</div></td></tr>`}</tbody></table></div>`;
}

function Stepper(e,viewKey){
  return `<div class="stepper" role="list">${STAGES.map((s,i)=>{
    const cls = i<e.stage? 'done' : i===e.stage? 'cur':''; const view = s.key===viewKey?'view':'';
    return `<button class="step ${cls} ${view}" ${i<=e.stage?`data-href="#/enquiries/${e.id}/${s.key}"`:'disabled'} role="listitem"><span class="dotp"></span><span class="n">${i+1}</span>${s.label}</button>`;}).join('')}</div>`;
}
function EnquiryWorkspace(e,sk){
  const idx=STAGES.findIndex(s=>s.key===sk); if(idx<0) return notFound();
  if(idx>e.stage) { location.replace('#/enquiries/'+e.id+'/'+STAGES[Math.min(e.stage,6)].key); return ''; }
  const s=slaState(e); const c=CUST[e.cust]; const stg=STAGES[Math.min(e.stage,6)];
  const ins=Insights(e,sk);
  const body = {enquiry:StEnquiry,configuration:StConfig,feasibility:StFeas,pricing:StPricing,approval:StApproval,proposal:StProposal,handoff:StHandoff}[sk](e,idx);
  return `
  <div class="head" style="margin-bottom:0"><div style="min-width:0">
      <div class="small" style="margin-bottom:6px">${e.id}, ${esc(c.name)}</div>
      <h1 style="font-size:28px;max-width:860px">${esc(e.subject)}</h1>
      <div class="sub">${e.stage>=7? 'Converted to '+esc(e.order) : `${stg.label} stage, ${stg.team.toLowerCase()} team${e.owner?`, owned by ${esc(e.owner)}`:''}<span style="margin-left:14px">${st(s.lvl,s.txt)}</span>`}</div></div>
  </div>
  ${Stepper(e,sk)}
  ${ins.length?`<section class="insights" aria-label="Assistant notes"><div class="ih">Assistant notes for this stage</div>${ins.map(i=>`<div class="ins">${st(i.lvl,'')}<div><div class="it">${i.t}</div><div class="id">${i.d}</div></div>${i.href?`<a class="btn sm" href="${i.href}">${i.cta||'Open'}</a>`:''}</div>`).join('')}</section>`:''}
  ${body}`;
}
function nextBar(e,idx,label,opts={}){
  const isCur = idx===e.stage;
  const next = STAGES[idx+1];
  if(!isCur){ return `<div class="inline-actions" style="margin-top:32px;justify-content:flex-end">${next?`<a class="btn" href="#/enquiries/${e.id}/${next.key}">View ${next.label.toLowerCase()}</a>`:''}</div>`; }
  return `<div class="inline-actions" style="margin-top:32px;justify-content:space-between;background:var(--fill);border-radius:14px;padding:14px 16px">
    <span class="small">${opts.hint||''}</span>
    <button class="btn primary" data-act="advance" data-id="${e.id}" data-idx="${idx}" ${opts.disabled?'disabled':''}>${label}</button></div>`;
}

      <div class="body">${esc(e.body)}</div>

      ${missing.length?`<button class="btn sm" style="margin-top:12px" data-act="clarify" data-id="${e.id}">Draft clarification email</button>`:''}

      <div style="display:flex;gap:10px;padding:5px 0">${st(sup.free>0?'ok':'','')}<div><div>${sup.free>0? 'Matching machine in stock' : 'Built to order at '+(sup.plant?sup.plant.name:'group supply')}</div><div class="small">${sup.free>0? sup.stock.cfg+' at Charleville-Mézières hub' : 'About '+sup.lead+' weeks from order'}</div></div></div>
      <div class="inline-actions" style="margin-top:14px"><a class="link small" href="#/catalogue/${m.id}">Catalogue specs</a>${alt.length?`<span class="small">Alternatives: ${alt.map(a=>`<a class="link" href="#/catalogue/${a.id}">${a.name}</a>`).join(', ')}</span>`:''}</div>

      <tr><td></td><td style="font-weight:600">Total list</td><td class="r num" style="font-weight:600">${gbp(ls.reduce((a,l)=>a+l.list,0))}</td></tr></tbody></table></div>

}

  const allOk = chain.every(c=>e.approvals[c[0]] || e.approved);
  return `<div class="grid g-side">
    <div class="well">
      <h3 style="margin-bottom:14px">Summary</h3>

/* =========================================================
   STAGE INSIGHTS — computed from data already in the platform
   ========================================================= */
function compRisk(e){
  const {m,cfg}=cfgOf(e); const stem=m.name.split('-')[0];
  return COMPONENTS.filter(c=>(c.use.includes(stem)||c.use==='All models') && (!/kW/.test(c.part) || (cfg.power && c.part.includes(cfg.power+' kW'))));
}
function Insights(e,sk){
  const out=[]; const {m,c,cfg}=cfgOf(e); const sup=supplyFor(e);
  const hist=HIST_QUOTES.filter(q=>MODEL[q.model] && MODEL[q.model].cat===m.cat);
  const risky=compRisk(e).filter(x=>x.dos<21);
  if(sk==='enquiry'){
    const miss=Object.entries(e.req).filter(([k,v])=>v.conf==='missing').map(([k])=>k.toLowerCase());
    if(miss.length) out.push({lvl:'warn',t:`${miss.length} requirement${miss.length>1?'s':''} missing from the email`,d:`No ${miss.join(', ')}. Ask now so configuration isn\u2019t blocked later.`});
    if(sup.free>0) out.push({lvl:'ok',t:`A matching ${m.name} is free in hub stock`,d:`${esc(sup.stock.cfg)} at Charleville-Mézières. Quoting from stock cuts lead time to about ${sup.lead} weeks.`,href:'#/supply/machines',cta:'View stock'});
    const lostSame=HIST_QUOTES.filter(q=>q.model===m.id&&q.status==='Lost');
    lostSame.forEach(q=>out.push({lvl:'warn',t:`${q.id} for ${m.name} was lost on ${q.note.toLowerCase()}`,d:`${esc(CUST[q.cust].name)}, ${dt(q.date)}. Lead that concern in the first reply.`}));
  }
  if(sk==='configuration'){
    const p=pricing(e); const top=p.ls.slice().sort((a,b)=>b.net-a.net)[0];
    out.push({lvl:'ok',t:`${esc(top.item)} is ${(top.net/p.net*100).toFixed(0)}% of the value`,d:`Options and services add ${gbp(p.net-top.net)}. Changes to the machine line move the price most.`});
    if(cfg.auto && m.auto) out.push({lvl:'ok',t:`Automation is listed for ${m.name}`,d:`AMADA publishes ${c.automation.toLowerCase()} for this model.`});
    risky.forEach(x=>out.push({lvl:x.dos<10?'crit':'warn',t:`${esc(x.part)} has ${x.dos} days of cover`,d:`Every ${m.name} build at this spec uses one. Next delivery ${dt(x.eta)}.`,href:'#/supply/components',cta:'Components'}));
  }
  if(sk==='feasibility'){
    if(sup.plant){ const wc=WORKCENTRES[sup.plant.id].filter(w=>w[2]>=90); wc.forEach(w=>out.push({lvl:w[2]>=95?'crit':'warn',t:`${w[0]} at ${sup.plant.name} is ${w[2]}% loaded`,d:`A new build would queue here. Keep ${sup.lead} weeks unless stock is used.`,href:'#/production/workcentres',cta:'Work centres'})); }
    risky.forEach(x=>out.push({lvl:x.dos<10?'crit':'warn',t:`${esc(x.part)} is short`,d:`${x.onhand} on hand, ${x.need} needed in 4 weeks, next arrival ${dt(x.eta)}.`,href:'#/supply/components',cta:'Components'}));
  }
  if(sk==='pricing'||sk==='approval'){
    const p=pricing(e); const RL=S.md.rules;
    if(p.margin<RL.minMargin) out.push({lvl:'crit',t:`Margin ${p.margin.toFixed(1)}% is below the ${RL.minMargin}% floor`,d:`Reduce the discount or remove low-margin services.`});
    else out.push({lvl:'ok',t:`Margin ${p.margin.toFixed(1)}% clears the ${RL.minMargin}% floor`,d:`Discount could reach ${Math.max(0,(100*(1-p.cost/(p.list*(1-RL.minMargin/100))))).toFixed(1)}% before hitting it.`});
    const lost=hist.filter(q=>q.status==='Lost'); const won=hist.filter(q=>q.status==='Won');
    if(hist.length) out.push({lvl:lost.length>won.length?'warn':'ok',t:`${c.name}: ${won.length} won, ${lost.length} lost in the last 90 days`,d: lost.length? `Lost on ${lost.map(q=>q.note.toLowerCase()).join(' and ')}. ${lost.some(q=>q.note==='Lead time')?'Lead time mattered more than price.':''}` : 'No recent losses in this category.'});
  }
  if(sk==='proposal'&&!e.sent){
    const need=['Floor layout drawing','Sample test report'].filter(k=>!(e.files||[]).find(f=>f.kind===k));
    if(need.length) out.push({lvl:'warn',t:`${need.join(' and ')} not attached`,d:'Quotes with a layout and test report answer the two most common follow-up questions.'});
  }
  if(sk==='proposal'&&e.snap) out.push({lvl:'ok',t:'Prices are locked to what was sent',d:`Master data changes after ${dtl(e.sent)} don\u2019t alter this quote.`});
  if(sk==='handoff'&&!e.order) out.push({lvl:'ok',t:sup.free>0?'Order will reserve hub stock':'Order will open a build at '+(sup.plant?sup.plant.name:'the plant'),d:`Earliest delivery ${dtl(sup.delivery)}. The PO is checked against the accepted quote value.`});
  return out.slice(0,3);
}

      <div class="tl">${phases.map((p,i)=>`<div class="${i<phaseIdx?'done':i===phaseIdx?'cur':''}"><div class="tt">${p}</div><div class="td">${i===0?dtl(o.po): i===1&&b? `${b.id} at ${PLANTS[b.plant].name}, now ${BUILD_STAGES[b.stage].toLowerCase()}` : i===1&&o.status==='Allocated from stock'?'Reserved from Charleville-Mézières hub stock' : i===2&&sh? 'Planned '+dtl(sh.dispatch) : i===3&&sh? 'Planned '+dtl(sh.arrive) : i===4&&sh? 'Engineer '+sh.engineer+', from '+dtl(sh.install) : i===5&&sh?'Planned '+dtl(sh.training):''}</div></div>`).join('')}</div>
      ${b?`<h2 style="margin:28px 0 14px">Build</h2><div class="well">${BuildTrack(b)}</div>`:''}
    </div>
    <div class="well">
      <h3 style="margin-bottom:12px">Details</h3>
      <dl class="kv"><dt>Customer</dt><dd>${esc(c.name)}, ${esc(c.city)}</dd><dt>Plant</dt><dd>${PLANTS[o.plant].name}</dd><dt>Promised</dt><dd class="num">${dtl(o.promise)}</dd><dt>Status</dt><dd>${o.status}</dd>${enq?`<dt>From enquiry</dt><dd><a class="link" href="#/enquiries/${enq.id}">${enq.id}</a></dd>`:''}${sh?`<dt>Shipment</dt><dd>${sh.id}</dd>`:''}</dl>
      <hr class="soft"><a class="link" href="#/catalogue/${o.model}">${MODEL[o.model].name} in catalogue</a>
    </div>

}
function BuildTrack(b){
  return `<div style="display:flex;justify-content:space-between;margin-bottom:12px"><span style="font-weight:500">${b.id}</span><span class="small num">Due ${dtl(b.due)}${b.pred!==b.due?`, predicted <span class="red">${dtl(b.pred)}</span>`:''}</span></div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${BUILD_STAGES.map((s,i)=>`<div title="${s}"><div class="bar ${i===b.stage&&b.risk==='crit'?'hot':''}" style="height:6px"><i style="width:${i<b.stage?100:i===b.stage?50:0}%"></i></div><div class="small" style="margin-top:6px;font-size:11.5px;line-height:1.25;${i===b.stage?'color:var(--ink);font-weight:500':''}">${s}</div></div>`).join('')}</div>`;
}

/* =========================================================
   PRODUCTION
   ========================================================= */
function Production(tab){
  const p=S.ui.plant||'CHV';
  const plantSeg=`<div class="seg">${['CHV','CDL'].map(k=>`<button class="${p===k?'on':''}" data-plant-set="${k}">${PLANTS[k].name}</button>`).join('')}</div>`;
  const tabs=`<div class="seg">${[['overview','Overview'],['builds','Build orders'],['workcentres','Work centres'],['quality','Run-off tests']].map(([k,l])=>`<a class="${tab===k?'on':''}" href="#/production/${k}" style="display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:8px;font-weight:500;${tab===k?'background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04)':'color:var(--muted)'}">${l}</a>`).join('')}</div>`;
  const builds=S.builds.filter(b=>b.plant===p);
  let body='';
  if(tab==='overview'){
    const wip=WIP[p].slice(); const cap=CAPACITY[p];
    const ratio=wip.map((w,i)=>w/cap[i]); const maxI=ratio.indexOf(Math.max(...ratio));
    const late=builds.filter(b=>b.risk!=='ok');
    body=`<div class="stats num" style="--n:4;margin-bottom:28px">
      <div class="stat"><div class="v">${builds.length}</div><div class="l">Build orders</div><div class="d">${builds.filter(b=>b.order==='STOCK').length} for hub stock</div></div>
      <div class="stat"><div class="v">${late.length}</div><div class="l">Behind plan</div></div>
      <div class="stat"><div class="v">${Math.round(WORKCENTRES[p].reduce((a,w)=>a+w[2],0)/WORKCENTRES[p].length)}%</div><div class="l">Average load</div></div>
      <div class="stat"><div class="v">${RUNOFF.filter(t=>t.plant===p&&t.result==='Pass').length}/${RUNOFF.filter(t=>t.plant===p).length}</div><div class="l">Run-off tests passed</div><div class="d">Last 7 days</div></div></div>
    <div class="well"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px"><h3>Work in progress by stage</h3><span class="small">Jobs against stage capacity</span></div>
      <div class="load" style="--n:7">${BUILD_STAGES.map((s,i)=>`<div class="col ${i===maxI&&ratio[i]>=1?'hot':''}"><div class="tube"><i style="height:${Math.min(100,ratio[i]*100)}%"></i></div><div class="lab"><b class="num">${wip[i]}<span class="small" style="font-weight:400"> / ${cap[i]}</span></b>${s}</div></div>`).join('')}</div>
      <div class="note" style="margin-top:16px">${ratio[maxI]>=1?`<span class="red">${BUILD_STAGES[maxI]} is over capacity.</span> Jobs arriving now wait for a free slot.`:`No stage is over capacity. ${BUILD_STAGES[maxI]} is the busiest.`}</div></div>
    <div class="grid g2 section">
      <div><h2 style="margin-bottom:10px">Behind plan</h2><div class="alist">${late.map(b=>`<div style="cursor:pointer" data-build="${b.id}">${st(b.risk,'')}<div><div class="at">${b.id}, ${esc(buildLabel(b))}</div><div class="ad">${esc(b.reason)}</div></div><span class="small num red">+${dayDiff(b.due,b.pred)}d</span></div>`).join('')||'<div class="empty">Everything is on plan.</div>'}</div></div>
      <div><h2 style="margin-bottom:10px">Suggested actions</h2><div class="well">${(Recommendations().filter(x=>x.plant===p).slice(0,2).join('')||'<div class="small">No actions suggested for this plant.</div>')}</div></div>
    </div>`;
  } else if(tab==='builds'){
    body=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Build order</th><th>For</th><th>Stage</th><th class="r">Start</th><th class="r">Due</th><th class="r">Predicted</th><th>Status</th></tr></thead><tbody>
    ${builds.map(b=>`<tr class="click" data-build="${b.id}"><td class="num"><div class="t">${b.id}</div></td><td><div class="t">${esc(buildLabel(b))}</div><div class="s">${b.order==='STOCK'?'Hub stock':esc(CUST[findOrder(b.order).cust].name)+', '+b.order}</div></td><td>${BUILD_STAGES[b.stage]}<div class="s">Step ${b.stage+1} of 7</div></td><td class="r num">${dt(b.start)}</td><td class="r num">${dt(b.due)}</td><td class="r num ${b.pred>b.due?'red':''}">${dt(b.pred)}</td><td>${st(b.risk,b.risk==='ok'?'On plan':b.risk==='crit'?'At risk':'Watch')}</td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">No build orders at this plant.</div></td></tr>'}</tbody></table></div>`;
  } else if(tab==='workcentres'){
    body=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Work centre</th><th>Stage</th><th>Load this week</th><th class="r"></th><th>Status</th></tr></thead><tbody>
    ${WORKCENTRES[p].map(w=>`<tr><td class="t">${w[0]}</td><td class="muted">${BUILD_STAGES[w[1]]}</td><td style="width:260px;padding-top:21px"><div class="bar ${w[2]>=95?'hot':''}"><i style="width:${w[2]}%"></i></div></td><td class="r num">${w[2]}%</td><td>${w[2]>=95?st('crit','Constraint'):w[2]>=90?st('warn','High'):w[2]<45?st('','Spare capacity'):st('ok','Normal')}</td></tr>`).join('')}</tbody></table></div>
    <div class="note" style="margin-top:14px">Load is booked hours against available hours from the plant\u2019s shift calendar. Demo values.</div>`;
  } else if(tab==='quality'){
    const tests=RUNOFF.filter(t=>t.plant===p);
    body=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Build</th><th>Test</th><th>Result</th><th>Inspector</th><th class="r">Date</th></tr></thead><tbody>
    ${tests.map(t=>`<tr><td class="num">${t.build}</td><td><div class="t">${t.test}</div>${t.note?`<div class="s">${esc(t.note)}</div>`:''}</td><td>${st(t.result==='Pass'?'ok':'crit',t.result)}</td><td>${t.by}</td><td class="r num">${dt(t.at)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  return `<div class="head"><div><h1>Production</h1><div class="sub">${PLANTS[p].name}, ${PLANTS[p].scope.charAt(0).toLowerCase()+PLANTS[p].scope.slice(1)}.</div></div><div class="actions">${plantSeg}</div></div>
  <div style="margin-bottom:24px">${tabs}</div>${body}`;
}
function buildLabel(b){ if(b.order==='STOCK') return b.stockCfg; const o=findOrder(b.order); return o? o.config : b.order; }

function Supply(tab){
  const tabs=`<div class="seg">${[['machines','Machine stock'],['components','Components']].map(([k,l])=>`<a href="#/supply/${k}" style="display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:8px;font-weight:500;${tab===k?'background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04)':'color:var(--muted)'}">${l}</a>`).join('')}</div>`;
  let body='';
  if(tab==='machines'){
    body=`<div class="note" style="margin-bottom:16px;max-width:720px">Finished machines held at the Charleville-Mézières European hub. Enquiries check this before quoting a build lead time.</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Machine</th><th class="r">Available</th><th class="r">Allocated</th><th class="r">Free</th><th class="r">In build</th><th>Matching enquiries</th></tr></thead><tbody>
    ${MACHINE_STOCK.map(s=>{const m=S.enq.filter(e=>e.match.model===s.model&&e.stage<6);return `<tr><td><div class="t">${esc(s.cfg)}</div><div class="s"><a class="link" href="#/catalogue/${s.model}">${MODEL[s.model].name}</a></div></td><td class="r num">${s.avail}</td><td class="r num">${s.alloc}</td><td class="r num ${s.avail-s.alloc>0?'':'muted'}">${s.avail-s.alloc}</td><td class="r num">${s.inbound}</td><td>${m.map(e=>`<a class="link" href="#/enquiries/${e.id}">${e.id}</a>`).join(', ')||'<span class="muted">None</span>'}</td></tr>`}).join('')}</tbody></table></div>`;
  } else {
    body=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Component</th><th>Plant</th><th class="r">On hand</th><th class="r">Needed, 4 weeks</th><th class="r">Inbound</th><th class="r">Next arrival</th><th class="r">Days of cover</th><th></th></tr></thead><tbody>
    ${COMPONENTS.map(c=>{const lvl=c.dos<10?'crit':c.dos<21?'warn':'ok';const short=c.need-c.onhand-c.inbound;return `<tr><td><div class="t">${esc(c.part)}</div><div class="s">${esc(c.use)}</div></td><td>${PLANTS[c.plant].name}</td><td class="r num">${c.onhand}</td><td class="r num">${c.need}</td><td class="r num">${c.inbound}</td><td class="r num">${dt(c.eta)}</td><td class="r num">${st(lvl,c.dos+'')}</td><td class="r">${short>0?`<button class="btn sm dark" data-act="raise-po" data-part="${esc(c.part)}" data-qty="${short}">Raise PO for ${short}</button>`:''}</td></tr>`}).join('')}</tbody></table></div>
    <div class="note" style="margin-top:14px">Needed quantity is exploded from build orders due in the next 4 weeks. Days of cover divides on-hand stock by daily demand.</div>`;
  }
  return `<div class="head"><div><h1>Supply and stock</h1><div class="sub">What\u2019s on hand, what\u2019s coming and what builds will need.</div></div></div><div style="margin-bottom:24px">${tabs}</div>${body}`;
}

function dlgClarify(e){

  const txt=`Hi ${e.contact.split(' ')[0]},\n\nThank you for your enquiry about ${e.subject.split('—')[0].trim().toLowerCase()}. So we can configure and price this accurately, could you confirm:\n\n${missing.map(([k,v])=>'- '+k+(v.conf==='missing'?'':' (we have: '+v.v+')')).join('\n')}\n\nIf it helps, we can also run sample parts at our technical centre.\n\nKind regards,\n${e.owner||'AMADA UK sales'}\nAMADA UK`;
  openLayer('dialog',`<div class="dh"><h2>Clarification email</h2><div class="small" style="margin-top:4px">To ${esc(e.email)}. Built from the missing and uncertain fields.</div></div>
  <div class="db"><div class="field"><label for="subj">Subject</label><input class="input" id="subj" value="Re: ${esc(e.subject)}"></div><div class="field" style="margin-top:12px"><label for="mb">Message</label><textarea class="input" id="mb" rows="12">${esc(txt)}</textarea></div></div>
  <div class="df"><button class="btn" data-close>Cancel</button><button class="btn primary" id="sendClar">Send email</button></div>`,p=>{
    p.querySelector('#sendClar').onclick=()=>{ e.log=(e.log||[]).concat({at:new Date().toISOString(),t:'Clarification sent'}); save(); closeLayer(); toast('Clarification sent to '+e.contact); };
  });
}

}
function dlgNewEnq(){
  openLayer('dialog',`<div class="dh"><h2>Log enquiry</h2><div class="small" style="margin-top:4px">Paste the customer\u2019s email. Requirements and a suggested machine are extracted from it.</div></div>
  <div class="db"><div class="form-grid">
    <div class="field"><label for="nc">Customer</label><select class="input" id="nc">${CUSTOMERS.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="ncon">Contact name</label><input class="input" id="ncon" placeholder="Full name"></div>
    <div class="field full"><label for="nsub">Subject</label><input class="input" id="nsub" placeholder="e.g. Quote for fibre laser 3015"></div>
    <div class="field full"><label for="nb">Email</label><textarea class="input" id="nb" rows="7" placeholder="Paste the email body"></textarea></div>
    <div class="field full" id="nPrev"></div>
  </div></div>
  <div class="df"><button class="btn" data-close>Cancel</button><button class="btn primary" id="nSave">Log enquiry</button></div>`,p=>{
    const prev=()=>{ const x=extract(p.querySelector('#nb').value+' '+p.querySelector('#nsub').value); p.querySelector('#nPrev').innerHTML = x.model? `<div class="well" style="padding:14px 16px"><div class="small">Suggested machine</div><div style="font-weight:600;margin-top:2px">${MODEL[x.model].name}</div><div class="small" style="margin-top:4px">${Object.entries(x.req).filter(([k,v])=>v.conf!=='missing').map(([k,v])=>k+': '+v.v).join(', ')||'No specific requirements found yet'}</div></div>` : ''; };
    p.querySelector('#nb').oninput=prev; p.querySelector('#nsub').oninput=prev;
    p.querySelector('#nSave').onclick=()=>{
      const sub=p.querySelector('#nsub'), body=p.querySelector('#nb'), con=p.querySelector('#ncon');
      let bad=false; [sub,body,con].forEach(i=>{ i.classList.toggle('bad',!i.value.trim()); if(!i.value.trim()) bad=true; });
      if(bad){ p.querySelector('#nPrev').insertAdjacentHTML('afterbegin','<div class="err" style="margin-bottom:8px">Add a contact, subject and email body to log the enquiry.</div>'); return; }
      const x=extract(body.value+' '+sub.value); const n=Math.max(...S.enq.map(e=>+e.id.slice(-4)))+1;
      const c=CUST[p.querySelector('#nc').value];
      const e={id:'ENQ-2026-'+String(n).padStart(4,'0'),cust:c.id,contact:con.value.trim(),email:con.value.trim().toLowerCase().replace(/\s+/g,'.')+'@'+c.name.toLowerCase().replace(/[^a-z]/g,'').slice(0,14)+'.com',at:new Date().toISOString().slice(0,16),hoursIn:0,priority:'Medium',subject:sub.value.trim(),body:body.value,attach:[],req:x.req,match:{model:x.model||'ensis-aje',range:x.range||0,power:x.power,auto:x.auto},stage:0,owner:null};
      S.enq.unshift(e); save(); closeLayer(); location.hash='#/enquiries/'+e.id; toast(e.id+' logged');
    };
  });
}
/* Rule-based extraction (an LLM would do this in production; rules keep the demo deterministic) */
function extract(t){
  const s=t.toLowerCase(); const req={}; let model=null, range=0, power=null, auto=false;
  const size=t.match(/(\d{4})\s*[x×]\s*(\d{4})/); if(size) req['Sheet size']=R(size[1]+' × '+size[2]+' mm','high');
  const kw=t.match(/(\d{1,2})\s?kw/i); if(kw){ power=+kw[1]; req['Laser power']=R('~'+kw[1]+' kW requested','high'); }
  const mats=['mild steel','stainless','aluminium','aluminum','copper','brass','galvanised'].filter(m=>s.includes(m)); req['Materials']= mats.length? R(mats.join(', '),'high') : R('Not stated','missing');
  if(/tower|automation|loading|unloading|lights-out|lights out/.test(s)){ auto=true; req['Automation']=R('Requested','high'); }
  const ms=Object.values(MODEL);
  const full=ms.find(m=>s.includes(m.name.toLowerCase())); if(full) model=full.id;
  if(!model){ const hit=ms.find(m=>{ const stem=m.name.toLowerCase().split(/[- ]/)[0]; return stem.length>=3 && new RegExp('\\b'+stem+'\\b').test(s); }); if(hit) model=hit.id; }
  if(!model){
    if(/tube|profile|angle|channel/.test(s)) model='ensis-rie';
    else if(/weld/.test(s)) model='flw-ensise';
    else if(/robot/.test(s)&&/bend/.test(s)) model='egb-arce';
    else if(/tool chang|atc/.test(s)) model='hg-atc';
    else if(/press brake|bend/.test(s)) model= /servo|electric/.test(s)?'egb-e':'hg';
    else if(/combination|punch.*laser|laser.*punch/.test(s)) model='acies-aje';
    else if(/punch|turret/.test(s)) model='em-zre';
    else if(/laser|fibre|fiber|cut/.test(s)) model = power && power>8 ? 'ensis-aje' : (/compact|small|prototype/.test(s)?'brevis-aj':'orsus-aje');
  }
  if(model&&MODEL[model].ranges&&size){ const i=MODEL[model].ranges.findIndex(r=>+size[1]<=r[0]&&+size[2]<=r[1]); range=i<0?0:i; }
  if(model&&MODEL[model].power&&power){ const p=MODEL[model].power; if(power<p[0]||power>p[1]) req['Laser power'].conf='med'; }
  if(!model) model=null;
  req['Floor space and power']=R('Not stated','missing');
  return {req,model,range,power,auto};
}

/* =========================================================
   EVENT BINDING
   ========================================================= */
function bind(r){
  document.querySelectorAll('[data-href]').forEach(el=>el.addEventListener('click',ev=>{ const inner=ev.target.closest('a,button,input,select,label,textarea'); if(inner && inner!==el && el.contains(inner)) return; location.hash=el.dataset.href; }));
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ S.ui.enqFilter=b.dataset.filter; save(); render(); });
  const q=$('#q'); if(q){ q.oninput=()=>{ S.ui.q=q.value; const pos=q.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); }; }
  document.querySelectorAll('[data-plant-set]').forEach(b=>b.onclick=()=>{ S.ui.plant=b.dataset.plantSet; save(); render(); });
  document.querySelectorAll('[data-plant]').forEach(a=>a.addEventListener('click',()=>{ S.ui.plant=a.dataset.plant; save(); }));
  document.querySelectorAll('[data-build]').forEach(el=>el.onclick=()=>dlgBuild(el.dataset.build));
  document.querySelectorAll('[data-ship]').forEach(el=>el.onclick=()=>dlgShip(el.dataset.ship));
  document.querySelectorAll('[data-cust]').forEach(el=>el.onclick=()=>dlgCustomer(el.dataset.cust));
  document.querySelectorAll('[data-bind]').forEach(el=>el.onchange=()=>{ const e=findEnq(el.dataset.id); e[el.dataset.bind]=el.value||null; save(); render(); toast(el.dataset.bind==='owner'?(el.value?'Assigned to '+el.value:'Owner removed'):'Priority set to '+el.value); });
  document.querySelectorAll('[data-cfg]').forEach(el=>el.onchange=()=>{ const e=findEnq(el.dataset.id); cfgOf(e); e.cfg[el.dataset.cfg]= el.dataset.cfg==='variant'? el.value : +el.value; save(); render(); });
  document.querySelectorAll('[data-cfgt]').forEach(el=>el.onclick=()=>{ const e=findEnq(el.dataset.id); cfgOf(e); e.cfg[el.dataset.cfgt]=!e.cfg[el.dataset.cfgt]; save(); render(); });
  document.querySelectorAll('[data-chk]').forEach(el=>{ const f=()=>{ const e=findEnq(el.dataset.id); e.checks=e.checks||{}; e.checks[el.dataset.chk]=!e.checks[el.dataset.chk]; save(); render(); }; el.onclick=f; el.onkeydown=ev=>{ if(ev.key===' '||ev.key==='Enter'){ev.preventDefault();f();} }; });
  const d=document.querySelector('[data-disc]'); if(d){ d.onchange=()=>{ const e=findEnq(d.dataset.disc); e.discount=Math.max(0,+d.value||0); save(); render(); }; }
  const cm=$('#cm'); if(cm){ cm.onchange=()=>{ const e=findEnq(r[1]); e.comment=cm.value; save(); }; }
  document.querySelectorAll('[data-file]').forEach(inp=>inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const e=findEnq(inp.dataset.id); e.files=(e.files||[]).filter(x=>x.kind!==inp.dataset.file).concat({kind:inp.dataset.file,name:f.name}); save(); render(); toast(inp.dataset.file+' attached'); });
  document.querySelectorAll('[data-md-price]').forEach(inp=>inp.onchange=()=>{ const k=inp.dataset.mdPrice, i=inp.dataset.i; const v=Math.max(0,Math.round(+inp.value||0)); const P=S.md.prices; const old= i!==undefined? P[k][+i] : P[k];
    if(v===old) return; if(i!==undefined) P[k][+i]=v; else P[k]=v;
    const name=(MODEL[k]?MODEL[k].name+(i==='1'?' per kW':' base'):({auto_laser:'Laser automation',auto_punch:'Punching automation',software:'Software seat',install:'Delivery and installation',training:'Training courses'})[k]);
    mdLog(name,gbp(old),gbp(v)); save(); const n=S.enq.filter(e=>e.stage<7&&!e.snap&&(MODEL[k]?e.match.model===k:true)).length; render(); toast(`${name} updated, ${n} open enquir${n===1?'y':'ies'} repriced`); });
  document.querySelectorAll('[data-md-rule]').forEach(inp=>inp.onchange=()=>{ const k=inp.dataset.mdRule; const v=Math.max(0,+inp.value||0); const old=S.md.rules[k]; if(v===old) return; S.md.rules[k]=v; mdLog(inp.getAttribute('aria-label'),old+'%',v+'%'); save(); render(); toast('Rule updated across all open enquiries'); });
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); act(b.dataset.act,b.dataset); });
}
function act(a,ds){
  const e=ds.id?findEnq(ds.id):null;
  switch(a){
    case 'new-enq': dlgNewEnq(); break;
    case 'clarify': dlgClarify(e); break;
    case 'advance': { const i=+ds.idx; e.stage=Math.max(e.stage,i+1); e.hoursIn=0; save(); location.hash='#/enquiries/'+e.id+'/'+STAGES[i+1].key; toast(STAGES[i].label+' complete'); break; }
    case 'approve': { e.approvals=e.approvals||{}; e.approvals[ds.who]=true; save(); render(); toast('Approved'); break; }
    case 'send-quote': { const missing=['Floor layout drawing','Sample test report'].filter(k=>!(e.files||[]).find(f=>f.kind===k)); if(missing.length && !confirm('Send without: '+missing.join(', ')+'?')) return; e.snap=pricing(e); e.sent=TODAY; save(); render(); toast('Quote sent to '+e.contact); break; }
    case 'accept': { e.accepted=TODAY; e.stage=6; save(); location.hash='#/enquiries/'+e.id+'/handoff'; toast('Moved to order handoff'); break; }
    case 'lost': { if(!confirm('Mark this quote as lost?')) return; HIST_QUOTES.unshift({id:e.id.replace('ENQ','QT'),cust:e.cust,model:e.match.model,value:pricing(e).net,status:'Lost',date:TODAY,note:'Recorded by sales'}); S.enq=S.enq.filter(x=>x.id!==e.id); save(); location.hash='#/quotes'; toast('Marked as lost'); break; }
    case 'create-order': {
      const f=$('#poForm'); const g=n=>f.elements[n].value.trim(); const errs=[];
      ['pono','podate','poval','deliv','site'].forEach(n=>{ f.elements[n].classList.toggle('bad',!g(n)); if(!g(n)) errs.push(n); });
      const p=pricing(e); const val=+g('poval'); const diff=Math.abs(val-p.net)/p.net;
      let msg=''; if(errs.length) msg='Fill in the highlighted fields.'; else if(diff>0.005){ msg='PO value differs from the accepted quote by '+gbp(Math.abs(val-p.net))+'. Check with the customer before release.'; f.elements.poval.classList.add('bad'); }
      if(msg){ $('#poErr').innerHTML=`<span class="err">${msg}</span>`; return; }
      const sup=supplyFor(e); const {m,c}=cfgOf(e); const n=Math.max(...S.orders.map(o=>+o.id.slice(-4)))+1; const oid='SO-2026-'+String(n).padStart(4,'0');
      const fromStock=sup.free>0; const plant=c.plant||'CHV';
      S.orders.unshift({id:oid,cust:e.cust,model:m.id,config:lines(e)[0].item+(lines(e)[0].detail?', '+lines(e)[0].detail.replace('Working range ',''):''),value:val,plant,po:g('podate'),promise:g('deliv'),status:fromStock?'Allocated from stock':'In build'});
      if(fromStock){ sup.stock.alloc++; } else { const bn=Math.max(...S.builds.map(b=>+b.id.slice(-4)))+1; S.builds.unshift({id:'BO-26-'+bn,order:oid,plant,stage:0,start:addDays(TODAY,7),due:addDays(g('deliv'),-10),pred:addDays(g('deliv'),-10),risk:'ok',reason:''}); }
      e.order=oid; e.po={pono:g('pono')}; e.stage=7; save(); render(); toast(oid+' created'); break; }
    case 'draft-notice': dlgNotice(ds.order); break;
    case 'raise-po': toast('Purchase request raised: '+ds.qty+' × '+ds.part); break;
    case 'apply-rec': { if(ds.id==='swap'){ const b1=S.builds.find(b=>b.id==='BO-26-1142'), b2=S.builds.find(b=>b.id==='BO-26-1144'); b1.risk='ok'; b1.pred=b1.due; b1.reason=''; b2.risk='warn'; b2.pred=addDays(b2.due,6); b2.reason='Oscillator module reassigned to BO-26-1142; waits for 5 Oct delivery.'; save(); render(); toast('Module swapped, SO-2026-0412 back on plan'); } break; }
  }
}

try{ render(); }
catch(err){ console.error('Recovering from saved data', err); S=fresh(); boot(); save(); render(); setTimeout(()=>toast('Saved demo data was out of date and has been reset'),300); }
