<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMADA Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --red:#FC1B1C; --red-soft:#FFE9E9; --ink:#000; --paper:#fff;
  --fill:#F4F4F4; --fill2:#EAEAEA; --muted:#6B6B6B; --faint:#A3A3A3; --line:rgba(0,0,0,.08);
  --ease:cubic-bezier(0.2,0,0,1);
  --side:236px;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;letter-spacing:-0.02em;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}

/* Sidebar */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:#000;color:#fff;display:flex;flex-direction:column;z-index:30;padding:22px 12px 16px}
.brand{padding:0 12px 26px;display:flex;align-items:baseline;gap:8px}
.brand b{color:var(--red);font-size:21px;font-weight:700;letter-spacing:-0.01em}
.brand span{color:rgba(255,255,255,.55);font-size:13px}
.navgroup{margin-bottom:18px}
.navgroup h6{margin:0 0 4px;padding:0 12px;font-size:12px;font-weight:500;color:rgba(255,255,255,.38)}
.navitem{position:relative;display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 12px;border-radius:9px;color:rgba(255,255,255,.62);transition:color 120ms, background-color 120ms}
.navitem:hover{color:#fff;background:rgba(255,255,255,.06)}
.navitem.on{color:#fff;background:rgba(255,255,255,.1)}
.navitem.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.navitem em{font-style:normal;font-size:12px;color:rgba(255,255,255,.45)}
.navitem.on em{color:rgba(255,255,255,.8)}
.side .foot{margin-top:auto;padding:12px;font-size:12px;color:rgba(255,255,255,.4)}
.side .foot button{background:none;border:0;padding:0;color:rgba(255,255,255,.6);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Main */
.main{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:16px;padding:0 40px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:linear-gradient(rgba(0,0,0,.035),transparent);pointer-events:none;opacity:var(--edge,0);transition:opacity 150ms}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0;flex:1;white-space:nowrap;overflow:hidden}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--faint)}
.crumbs .cur{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.top .who{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.demo{font-size:12px;color:var(--muted);background:var(--fill);padding:5px 10px;border-radius:99px}
.top .menu-btn{display:none}
.page{padding:28px 40px 96px;max-width:1360px}

/* Type */
h1{font-size:32px;line-height:1.1;font-weight:600;letter-spacing:-0.035em;margin:0}
h2{font-size:19px;line-height:1.25;font-weight:600;letter-spacing:-0.03em;margin:0}
h3{font-size:15px;font-weight:600;letter-spacing:-0.02em;margin:0}
.sub{color:var(--muted);margin-top:6px;font-size:14px}
.small{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.red{color:var(--red)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}
.section{margin-top:40px}
.section > .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:12px}
.section > .sh a{font-size:13px;color:var(--muted)}
.section > .sh a:hover{color:var(--ink)}

/* Surfaces */
.well{background:var(--fill);border-radius:16px;padding:22px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g-main{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g-side{grid-template-columns:minmax(0,1fr) 360px}

/* Stats band */
.stats{display:grid;grid-template-columns:repeat(var(--n,4),1fr);background:var(--fill);border-radius:16px}
.stat{padding:20px 22px;position:relative}
.stat + .stat::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:1px;background:var(--line)}
.stat .v{font-size:28px;font-weight:600;letter-spacing:-0.04em;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted);margin-top:4px}
.stat .d{font-size:12px;margin-top:8px;color:var(--muted)}

/* Flow band (overview hero) */
.flow{display:grid;grid-template-columns:repeat(5,1fr);position:relative;margin:8px 0 0}
.flow::before{content:"";position:absolute;left:10%;right:10%;top:65px;height:2px;background:rgba(0,0,0,.14)}
.flow .node{position:relative;text-align:center;padding:0 8px;cursor:pointer}
.flow .node .pin{width:12px;height:12px;border-radius:50%;background:var(--ink);margin:16px auto 18px;box-shadow:0 0 0 6px var(--fill);position:relative}
.flow .node.hot .pin{background:var(--red)}
.flow .node .v{font-size:44px;font-weight:600;letter-spacing:-0.05em;line-height:1}
.flow .node .l{font-size:14px;margin-top:8px}
.flow .node .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.flow .node:hover .l{text-decoration:underline;text-underline-offset:3px}

/* Tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:left;padding:0 12px 10px;white-space:nowrap}
.tbl td{padding:14px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--fill)}
.tbl tr.click:hover td:first-child{border-radius:10px 0 0 10px}
.tbl tr.click:hover td:last-child{border-radius:0 10px 10px 0}
.tbl tr.click:hover td,.tbl tr.click:hover + tr td{border-top-color:transparent}
.tbl .r{text-align:right}
.tbl td .t{font-weight:500}
.tbl td .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.tbl-wrap{overflow-x:auto}
.well .tbl td{border-top-color:rgba(0,0,0,.07)}

/* Status */
.st{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;flex:none;background:#C4C4C4}
.st.crit i{background:var(--red)}
.st.crit{color:var(--red)}
.st.warn i{background:transparent;box-shadow:inset 0 0 0 1.6px var(--red)}
.st.ok i{background:var(--ink)}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--fill);white-space:nowrap}
.chip.red{background:var(--fill);color:var(--red)}
.chip.dark{background:var(--ink);color:#fff}

/* Buttons */
.btn{height:36px;padding:0 16px;border-radius:10px;border:0;background:var(--fill);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition-property:scale,background-color,opacity;transition-duration:100ms,120ms,120ms;transition-timing-function:ease-out}
.btn:hover{background:var(--fill2)}
.btn:active{scale:.96}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{background:#E0000F}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#262626}
.btn.ghost{background:transparent;padding:0 10px}
.btn.ghost:hover{background:var(--fill)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.sm{height:30px;padding:0 12px;border-radius:8px;font-size:13px}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:rgba(0,0,0,.25);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--ink)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}

/* Segmented */
.seg{display:inline-flex;background:var(--fill);border-radius:11px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 14px;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-weight:500;transition:background-color 150ms,color 150ms}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04)}

/* Inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--muted)}
.input,select.input,textarea.input{height:38px;border:0;border-radius:10px;background:var(--fill);padding:0 12px;outline:none;transition:box-shadow 120ms}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus{box-shadow:inset 0 0 0 1.5px var(--ink);background:#fff}
.input.bad{box-shadow:inset 0 0 0 1.5px var(--red)}
.err{font-size:12px;color:var(--red)}
.search{width:260px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check .box{width:18px;height:18px;border-radius:5px;background:#fff;box-shadow:inset 0 0 0 1.5px #BDBDBD;flex:none;margin-top:1px;display:grid;place-items:center;transition:background-color 120ms,box-shadow 120ms}
.check.done .box{background:var(--ink);box-shadow:none}
.check.done .box::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.check.auto{cursor:default}
.check .ct{font-weight:500}
.check .cd{font-size:12.5px;color:var(--muted);margin-top:2px}
.toggle{width:38px;height:22px;border-radius:99px;background:#D6D6D6;position:relative;border:0;cursor:pointer;flex:none;transition:background-color 150ms}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform 200ms var(--ease)}
.toggle.on{background:var(--ink)}
.toggle.on::after{transform:translateX(16px)}

/* Key-value */
.kv{display:grid;grid-template-columns:150px 1fr;gap:10px 16px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0}
.rows > div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line)}
.rows > div:first-child{border-top:0}
.rows > div.total{font-weight:600;font-size:16px}

/* Stepper */
.stepper{display:flex;margin:24px 0 32px;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:110px;position:relative;padding-top:22px;font-size:13px;color:var(--faint);background:none;border:0;text-align:left;cursor:default}
.step::before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:var(--fill2)}
.step.done::before{background:var(--ink)}
.step.cur::before{background:linear-gradient(90deg,var(--red) 0 50%,var(--fill2) 50%)}
.step .dotp{position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;background:var(--fill2);box-shadow:0 0 0 3px #fff}
.step.done .dotp{background:var(--ink)}
.step.cur .dotp{background:var(--red)}
.step.done,.step.cur{color:var(--ink);cursor:pointer}
.step.view{font-weight:600}
.step .n{display:block;font-size:12px;color:var(--faint);font-weight:400}

/* Email */
.mail .from{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}
.mail .body{white-space:pre-wrap;line-height:1.6}
.attach{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.attach span{background:#fff;padding:7px 12px;border-radius:9px;font-size:13px}

/* Confidence */
.conf{font-size:12px;color:var(--muted)}
.conf.missing{color:var(--red)}

/* Bars */
.bar{height:6px;background:var(--fill2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.bar.hot i{background:var(--red)}
.load{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:10px;align-items:end}
.load .col{display:flex;flex-direction:column;gap:10px}
.load .tube{height:120px;width:28px;background:#fff;border-radius:8px;position:relative;overflow:hidden}
.load .tube i{position:absolute;left:0;right:0;bottom:0;background:var(--ink);border-radius:8px;transition:height 400ms var(--ease)}
.load .col.hot .tube i{background:var(--red)}
.load .lab{font-size:12.5px;line-height:1.3}
.load .lab b{display:block;font-size:18px;font-weight:600;letter-spacing:-0.03em}

/* Alerts list */
.alist > a,.alist > div{display:grid;grid-template-columns:14px 1fr auto;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.alist > :first-child{border-top:0}
.alist > a:hover .at{text-decoration:underline;text-underline-offset:3px}
.alist .st{margin-top:6px}
.alist .at{font-weight:500}
.alist .ad{font-size:12.5px;color:var(--muted);margin-top:2px}

/* V agent */
.v-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;border:0;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer;font-weight:500;transition:scale 100ms ease-out,background-color 120ms}
.v-btn:hover{background:#262626}.v-btn:active{scale:.96}
.v-btn b{color:var(--red);font-size:16px;font-weight:700;letter-spacing:-0.02em}
.v-btn kbd{font:inherit;font-size:11.5px;color:rgba(255,255,255,.5);margin-left:2px}
#vPanel{position:fixed;top:0;right:0;bottom:0;width:420px;background:#fff;z-index:40;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform 320ms var(--ease),visibility 0s 320ms;box-shadow:-1px 0 0 var(--line),-24px 0 48px rgba(0,0,0,.06);padding-top:env(safe-area-inset-top,0px)}
#vPanel.show{transform:none;visibility:visible;transition:transform 320ms var(--ease)}
@media (min-width:1280px){body.v-open .main{margin-right:420px}.main{transition:margin-right 320ms var(--ease)}}
.v-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 20px 12px}
.v-title{display:flex;align-items:baseline;gap:8px}
.v-title b{color:var(--red);font-size:26px;font-weight:700;letter-spacing:-0.04em;line-height:1}
.v-title span{font-weight:600;letter-spacing:-0.02em}
.v-ctx{margin-top:4px}
.v-body{flex:1;overflow-y:auto;padding:4px 20px 12px;overscroll-behavior:contain}
.v-empty{padding:28px 0 8px}
.v-hi{font-size:19px;font-weight:600;letter-spacing:-0.03em;line-height:1.25}
.v-empty p{color:var(--muted);margin:8px 0 0;line-height:1.5}
.v-u{margin:18px 0 0 40px;padding:10px 14px;background:var(--fill);border-radius:14px 14px 4px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.v-a{margin:16px 0 0;line-height:1.55;overflow-wrap:anywhere}
.v-a p{margin:0 0 8px}.v-a ul{margin:0 0 8px;padding-left:18px}.v-a li{margin:3px 0}
.v-a b{font-weight:600}
.v-acts{font-size:12px;color:var(--muted);margin-top:6px}
.v-err{color:var(--red)}
.v-live{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.v-dots{display:inline-flex;gap:4px}.v-dots i{width:5px;height:5px;border-radius:50%;background:var(--red);animation:vdot 1s infinite ease-in-out}
.v-dots i:nth-child(2){animation-delay:.15s}.v-dots i:nth-child(3){animation-delay:.3s}
@keyframes vdot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.v-sugg{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:22px}
.v-chip{border:0;background:none;padding:6px 0;cursor:pointer;text-align:left;color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:rgba(0,0,0,.2);text-underline-offset:3px}
.v-chip:hover{text-decoration-color:var(--red)}
.v-foot{display:flex;gap:8px;align-items:flex-end;padding:12px 20px 8px}
.v-foot textarea{flex:1;resize:none;min-height:38px;max-height:140px;padding:9px 12px;line-height:1.4}
.v-note{font-size:11.5px;color:var(--faint);padding:0 20px calc(14px + env(safe-area-inset-bottom,0px))}
@media (max-width:900px){#vPanel{width:100vw}.v-btn span,.v-btn kbd{display:none}}
@media (prefers-reduced-motion:reduce){.v-dots i{animation:none;opacity:.6}}
@media print{#vPanel,.v-btn{display:none !important}}

/* CPQ */
.alertline{padding:2px 0 2px 16px;box-shadow:inset 3px 0 0 var(--red)}
.cpq-grid{grid-template-columns:minmax(0,1fr) 320px;gap:40px;align-items:start}
.cpq-aside{position:sticky;top:76px}
.cpq-total{display:flex;flex-direction:column;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.cpq-total b{font-size:28px;font-weight:600;letter-spacing:-0.04em;line-height:1.15}
.choice{display:grid;grid-template-columns:18px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 10px;cursor:pointer;border-radius:0;transition:background-color 120ms}
.choice:first-child{border-top:0}
.choice:hover{background:var(--fill)}
.choice .radio{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #BDBDBD;transition:box-shadow 150ms}
.choice.on .radio{box-shadow:inset 0 0 0 5px var(--ink)}
.choice .cbody{display:flex;flex-direction:column;min-width:0}
.choice .ct{font-weight:500}
.choice.on .ct{font-weight:600}
.choice .cd{font-size:12.5px;color:var(--muted);margin-top:1px}
.choice.off{opacity:.42;cursor:not-allowed}
.choice.off:hover{background:none}
.match{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.match:first-of-type{border-top:0}
.match .mt{font-weight:600;font-size:15px}
.match.off .mt{color:var(--muted);font-weight:500}
.optrow{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.ck{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:7px 0}
.ck .st{margin-top:6px}
.stdlist{margin:0;padding:0 0 0 18px;line-height:1.8}
.mat-row{display:grid;grid-template-columns:200px 180px auto;gap:10px;margin-bottom:8px;align-items:center}
.toggle[disabled]{opacity:.5;cursor:default}
@media (max-width:1100px){.cpq-grid{grid-template-columns:1fr}.cpq-aside{position:static}}
@media (max-width:640px){.mat-row{grid-template-columns:1fr 1fr}.mat-row .btn{grid-column:1/-1;justify-self:start}}
@media print{.side,.top,.stepper,.cpq-aside,.head,#cpqDoc ~ *,.g-main > div:last-child{display:none !important}.main{margin:0}.page{padding:0}.g-main{display:block}.doc{box-shadow:none}}
/* Stage insights */
.insights{background:var(--fill);border-radius:16px;padding:16px 20px 6px;margin:-8px 0 28px}
.insights .ih{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.insights .ins{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid rgba(0,0,0,.06)}
.insights .ih + .ins{border-top:0}
.insights .ins .st{margin-top:6px}
.insights .it{font-weight:500}

const thNum = s => s==null? null : parseFloat(s);
const cpqModels = cat => Object.keys(CPQ_DB).filter(k=>CPQ_DB[k].cat===cat);
const cpqGet = id => (S.cpq||[]).find(c=>c.id===id);
function cpqState(c){
  if(!c.model||!CPQ_DB[c.model]) return {db:null,v:null,power:null};
  const db=CPQ_DB[c.model]; const v=db.variants[Math.min(c.vi||0,db.variants.length-1)];
  const power=v.powers? v.powers[Math.min(c.pi||0,v.powers.length-1)] : null;
  return {db,v,power,pi:Math.min(c.pi||0,(v.powers||[0]).length-1)};
}
function minPower(model){ const db=CPQ_DB[model]; return Math.min(...db.variants.flatMap(v=>v.powers||[0])); }
function autoFit(slug,v){ const a=AUTO_DB[slug]; if(!a) return 'confirm'; if(!a.bed) return 'confirm'; return v.bed===a.bed?'fit':'nofit'; }

/* Requirement checks against published data */
function cpqChecks(c,model=c.model,vi=c.vi,pi=c.pi){
  const db=CPQ_DB[model]; if(!db) return [];
  const v=db.variants[vi]||db.variants[0]; const p=v.powers? Math.min(pi||0,v.powers.length-1):0; const power=v.powers? v.powers[p]:null;
  const out=[]; const r=c.req||{};
  if(r.sheet && r.sheet[0] && r.sheet[1] && v.wr){
    const need=[Math.max(...r.sheet),Math.min(...r.sheet)], have=[Math.max(...v.wr),Math.min(...v.wr)];
    out.push({k:'sheet',ok:need[0]<=have[0]&&need[1]<=have[1],t:'Sheet size',d:`${r.sheet[0]} × ${r.sheet[1]} mm against ${v.wr[0]} × ${v.wr[1]} mm ${db.cat==='punch'?'axis travel':'working range'}`});
  }
  (r.mats||[]).forEach(x=>{
    if(!MATS[x.m]) return;
    if(!v.th){ out.push({k:'mat-'+x.m,ok:null,t:MATS[x.m]+(x.t?' '+x.t+' mm':''),d:'AMADA publishes no thickness table for this model'}); return; }
    const raw=v.th[x.m][p]; const cap=thNum(raw);
    if(!x.t){ out.push({k:'mat-'+x.m,ok:null,t:MATS[x.m],d:`Thickness not stated. Maximum at ${power} kW is ${cap} mm`}); return; }
    const note=(db.fn||{})[raw];
    out.push({k:'mat-'+x.m,ok:x.t>cap?false:(note&&x.t>((v.th[x.m].slice(0,p+1).filter(z=>!String(z).endsWith('*')).map(thNum).pop())??0)?null:true),t:`${MATS[x.m]} ${x.t} mm`,d:`Maximum ${cap} mm at ${power} kW${note?'. '+note:''}`,fn:!!note});
  });
  if(db.cat==='tube' && r.tube && r.tube.size){
    const T=db.tube, tb=r.tube; const lim={round:T.round,square:T.square,channel:T.channel,angle:T.angle}[tb.type];
    if(tb.type==='rect') out.push({k:'tsize',ok:tb.size<=T.rectDiag,t:`Rectangular tube, ${tb.size} mm across diagonals`,d:`Maximum ${T.rectDiag} mm`});
    else if(lim) out.push({k:'tsize',ok:tb.size>=lim[0]&&tb.size<=lim[1],t:`${({round:'Round tube Ø',square:'Square tube',channel:'Channel',angle:'Angle'})[tb.type]} ${tb.size} mm`,d:`Published range ${lim[0]} to ${lim[1]} mm`});
    if(tb.len) out.push({k:'tlen',ok:tb.len<=T.maxLen,t:`Tube length ${tb.len} mm`,d:`Maximum ${T.maxLen} mm`});
    if(tb.wt) out.push({k:'twt',ok:tb.wt<=T.maxWt,t:`Tube weight ${tb.wt} kg`,d:`Maximum ${T.maxWt} kg`});
    if(tb.wall){ const w=(tb.type==='channel'||tb.type==='angle')?T.wallOpen:T.wallTube; out.push({k:'twall',ok:tb.wall>=w[0]&&tb.wall<=w[1],t:`Wall ${tb.wall} mm`,d:`Published range ${w[0]} to ${w[1]} mm for this profile`}); }
  }
  if(db.cat==='bend' && r.part){
    if(r.part.len) out.push({k:'plen',ok:r.part.len<=v.len,t:`Part length ${r.part.len} mm`,d:`${db===CPQ_DB['egb-e']?'Maximum bending length':'Press beam length'} ${v.len} mm`});
    if(r.part.kn) out.push({k:'pkn',ok:r.part.kn<=v.kn,t:`Bending force ${r.part.kn} kN`,d:`Press capacity ${v.kn} kN`});
  }
  if(r.floor && r.floor.l && r.floor.w && v.dims){
    const fits=Math.max(v.dims[0],v.dims[1])<=Math.max(r.floor.l,r.floor.w) && Math.min(v.dims[0],v.dims[1])<=Math.min(r.floor.l,r.floor.w);
    out.push({k:'floor',ok:fits,t:'Floor space',d:`Machine ${v.dims[0]} × ${v.dims[1]} mm against ${r.floor.l} × ${r.floor.w} mm available${c.auto?'. Automation footprint not included':''}`});
  }
  return out;
}
const cpqPass = ch => ch.every(x=>x.ok!==false);

/* Pricing from master data */
function cpqPrices(){ const P=S.md.prices; return {VAR:P.cpqVar||{},OPT:P.cpqOpt||{},AUTO:P.cpqAuto||{}}; }
function cpqMachinePrice(model,vi,pi){
  const db=CPQ_DB[model]; const v=db.variants[vi]||db.variants[0]; const P=S.md.prices; const pb=P[model]||[0,0];
  const power=v.powers? v.powers[Math.min(pi||0,v.powers.length-1)]:null;
  const {VAR}=cpqPrices();
  return pb[0] + (power? pb[1]*(power-minPower(model)) : 0) + (VAR[v.code]||0);
}
function cpqOptState(c,o){ const s=cpqState(c); return o.rule({power:s.power,v:s.v}); }
function cpqLines(c){
  const {db,v,power}=cpqState(c); if(!db) return [];
  const P=S.md.prices; const {OPT,AUTO}=cpqPrices(); const out=[];
  out.push({grp:'Machine',item:v.code,detail:[power?power+' kW fibre':null,v.wr?(db.cat==='punch'?'Axis travel ':'Working range ')+v.wr[0]+' × '+v.wr[1]+' mm':null,v.tool||null,v.kn&&db.cat==='bend'?v.kn+' kN, '+v.len+' mm':null].filter(Boolean).join(', '),list:cpqMachinePrice(c.model,c.vi,c.pi),src:SM+db.src});
  db.opts.forEach(o=>{ const st=cpqOptState(c,o); if(st==='std') out.push({grp:'Option',item:o.name,detail:'Standard at this power',list:0,src:null}); else if(st==='opt'&&c.opts&&c.opts[o.k]) out.push({grp:'Option',item:o.name,detail:o.desc,list:OPT[c.model+'.'+o.k]||0,src:null}); });
  if(c.auto && AUTO_DB[c.auto]) out.push({grp:'Automation',item:AUTO_DB[c.auto].name,detail:autoFit(c.auto,v)==='confirm'?'Bed compatibility to confirm with applications':'Matched to the '+v.bed+' bed',list:AUTO[c.auto]||0,src:SM+'automated-machines/'+c.auto});
  const svc=c.svc||{};
  const swCat={laser:'laser cutting',tube:'laser cutting',punch:'punching',bend:'bending'}[db.cat];
  if(svc.software) out.push({grp:'Software',item:'AMADA '+swCat+' software',detail:'CAD/CAM programming seat',list:P.software,src:SRC+'software'});
  if(svc.install) out.push({grp:'Services',item:'Delivery and installation',detail:'Rigging, installation and commissioning',list:P.install,src:null});
  if(svc.training) out.push({grp:'Services',item:'Training courses',detail:'Operator and programmer training',list:P.training,src:null});
  return out;
}
function cpqPricing(c){
  const ls=cpqLines(c); const R_=S.md.rules; const le=c.enq&&findEnq(c.enq); const disc=(le&&le.cpq===c.id? le.discount : c.disc)||0;
  ls.forEach(l=>{ l.net=l.list*(1-disc/100); l.cost=l.list*((l.grp==='Services'?R_.costService:R_.costMachine)/100); });
  const list=ls.reduce((a,l)=>a+l.list,0), net=list*(1-disc/100), cost=ls.reduce((a,l)=>a+l.cost,0);
  return {ls,list,disc,net,cost,margin:net?(net-cost)/net*100:0};
}
/* Best match per model for the stated requirements */
function cpqMatches(c){
  return cpqModels(c.cat).map(model=>{
    const db=CPQ_DB[model]; let best=null, firstFail=null;
    db.variants.forEach((v,vi)=>(v.powers||[null]).forEach((pw,pi)=>{
      const ch=cpqChecks(c,model,vi,pi); const price=cpqMachinePrice(model,vi,pi);
      if(cpqPass(ch)){ if(!best||price<best.price) best={vi,pi,price,ch}; }
      else if(!firstFail) firstFail=ch.find(x=>x.ok===false);
    }));
    return {model,db,best,fail:firstFail};
  }).sort((a,b)=> (a.best?0:1)-(b.best?0:1) || (a.best&&b.best? a.best.price-b.best.price:0));
}
function cpqLabel(c){ const {v,power}=cpqState(c); return v? v.code+(power?', '+power+' kW':'') : 'Not configured'; }

function CpqStepper(c,sk){

    return `<button class="step ${ok?'done':''} ${cur?'cur view':''}" ${ok?`data-href="#/cpq/${c.id}/${k}"`:'disabled'} role="listitem"><span class="dotp"></span><span class="n">${i+1}</span>${l}</button>`}).join('')}</div>`;
}
function CpqSummary(c){
  const {db,v,power}=cpqState(c);
  if(!db) return `<div class="well"><div class="small">Build summary</div><div style="margin-top:8px">Choose a machine to start pricing.</div></div>`;
  const p=cpqPricing(c); const ch=cpqChecks(c); const bad=ch.filter(x=>x.ok===false), open=ch.filter(x=>x.ok===null);
  return `<div class="well cpq-sum">
    <div class="vs-hrow"><div class="small">Build summary</div>${vsChip('cpq',c.id)}</div>
    <div style="font-size:21px;font-weight:600;letter-spacing:-0.03em;margin:4px 0 2px">${esc(v.code)}</div>
    <div class="muted">${power?power+' kW':''}${power&&c.auto?', ':''}${c.auto?AUTO_DB[c.auto].name:''}</div>
    <div class="rows" style="margin-top:14px">
      ${v.wr?`<div><span class="muted">${db.cat==='punch'?'Axis travel':'Working range'}</span><span class="num">${v.wr[0]} × ${v.wr[1]} mm</span></div>`:''}
      ${db.cat==='bend'?`<div><span class="muted">Capacity</span><span class="num">${v.kn} kN, ${v.len} mm</span></div>`:''}
      <div><span class="muted">Footprint</span><span class="num">${v.dims[0]} × ${v.dims[1]} mm</span></div>
      <div><span class="muted">Weight</span><span class="num">${v.w[c.pi||0]!=null&&v.w[c.pi||0]!==undefined? v.w[Math.min(c.pi||0,v.w.length-1)].toLocaleString('en-GB')+' kg':'TBC'}</span></div>
    </div>
    <div style="margin-top:16px">${bad.length?st('crit',bad.length+' requirement'+(bad.length>1?'s':'')+' not met'):open.length?st('warn',open.length+' to confirm'):ch.length?st('ok','Meets every stated requirement'):st('','No requirements entered')}</div>
    <div class="cpq-total"><span class="small">Net price</span><b class="num">${gbp(p.net)}</b>${p.disc?`<span class="small num">after ${p.disc}% discount</span>`:''}</div>
    ${m3Has(c)?`<a class="btn dark cpq-3d" href="#/cpq/${c.id}/model">View in 3D and VR</a>`:`<div class="small" style="margin-top:14px">3D and VR are ready for the ENSIS-3015AJe and EGB-6020e.</div>`}
  </div>`;

function CpqPage(c,sk){
  if(sk==='model'){ if(!c.model||!m3Has(c)){ location.replace('#/cpq/'+c.id+'/'+(c.model?'machine':'requirements')); return ''; } return CpqModel(c); }
  const body={requirements:CpqReq,machine:CpqMachine,options:CpqOptions,price:CpqPrice,quote:CpqQuote}[sk];
  if(!body) return notFound();
  if(sk!=='requirements'&&!c.model){ location.replace('#/cpq/'+c.id+'/requirements'); return ''; }
  return `<div class="head" style="margin-bottom:0"><div><div class="small" style="margin-bottom:6px">${c.id}, ${esc(CUST[c.cust].name)}${c.enq?`, for <a class="link" href="#/enquiries/${c.enq}">${c.enq}</a>`:''}</div>
    <h1 style="font-size:28px">${c.model?esc(cpqLabel(c)):'New '+CPQ_CATS[c.cat].toLowerCase()+' configuration'}</h1></div></div>
  ${CpqStepper(c,sk)}
  <div class="grid cpq-grid"><div style="min-width:0">${body(c)}</div><aside class="cpq-aside">${CpqSummary(c)}</aside></div>`;
}
function numIn(id,val,ph,attrs=''){ return `<input class="input num" id="${id}" type="number" min="0" inputmode="decimal" value="${val??''}" placeholder="${ph}" ${attrs}>`; }

      <div class="field"><label for="ts">${r.tube&&r.tube.type==='rect'?'Size across diagonals (mm)':'Size (mm)'}</label>${numIn('ts',r.tube&&r.tube.size,'e.g. 60','data-cpq-req="tsize"')}</div>

      </div>`}).join('')}

}

function cpqSpecs(c){ const {db,v,power}=cpqState(c); return [v.wr?[db.cat==='punch'?'Axis travel':'Working range',v.wr.join(' × ')+' mm']:null,power?['Laser power',power+' kW']:null,v.tool?['Tooling',v.tool]:null,db.cat==='bend'?['Press capacity',v.kn+' kN']:null,db.cat==='bend'?['Bending length',v.len+' mm']:null,['Footprint',v.dims[0]+' × '+v.dims[1]+' mm']].filter(Boolean); }

function CpqQuote(c){

function cpqCreate(cust,cat,enq){
  const n=Math.max(0,...(S.cpq||[]).map(c=>+c.id.slice(-4)))+1;
  const c={id:'CPQ-2026-'+String(n).padStart(4,'0'),cust,enq,cat,created:TODAY,req:{sheet:null,mats:[],floor:{},tube:{type:'round'},part:{}},model:null,vi:0,pi:0,opts:{},auto:null,svc:{software:true,install:true,training:true,finance:false},disc:0,versions:[]};
  S.cpq.push(c); save(); return c;
}
function cpqFromEnquiry(e){
  const m=MODEL[e.match.model]; const cat= e.match.model==='ensis-rie'?'tube':({laser:'laser',punch:'punch',bend:'bend'})[m.cat]||null;
  if(!cat) return null;
  const c=cpqCreate(e.cust,cat,e.id); c.disc=e.discount||0;
  const sz=e.req['Sheet size']&&e.req['Sheet size'].v.match(/(\d{4})\s*×\s*(\d{4})/); if(sz) c.req.sheet=[+sz[1],+sz[2]];
  const mt=(e.req['Materials']&&e.req['Materials'].v||'').toLowerCase();
  [['ms','mild steel'],['ss','stainless'],['al','alumin'],['br','brass'],['cu','copper']].forEach(([k,w])=>{ if(mt.includes(w)) c.req.mats.push({m:k,t:null}); });
  const len=e.req['Part length']&&e.req['Part length'].v.match(/([\d.]+)\s*m\b/); if(len) c.req.part.len=Math.round(+len[1]*1000);
  if(CPQ_DB[e.match.model]){ c.model=e.match.model; const db=CPQ_DB[c.model]; const cfg=e.cfg||{};
    if(cfg.range!=null&&db.variants[cfg.range]) c.vi=cfg.range;
    const pw=cfg.power??e.match.power; const v=db.variants[c.vi]; if(v.powers&&pw){ const i=v.powers.indexOf(+pw); c.pi= i>=0?i: v.powers.findIndex(x=>x>=pw); if(c.pi<0) c.pi=v.powers.length-1; } }
  e.cpq=c.id; save(); return c;
}

        <div style="margin-top:14px">${ch.map(x=>`<div class="ck">${st(x.ok===false?'crit':x.ok===null?'warn':'ok','')}<div><div>${esc(x.t)}</div><div class="small">${esc(x.d)}</div></div></div>`).join('')||'<div class="small">No customer requirements entered.</div>'}</div>

function bindCpq(r){
  if(r[0]!=='cpq'||!r[1]) return;
  const c=cpqGet(r[1]); if(!c) return;
  if(r[2]==='model'&&c.model&&m3Has(c)){ m3Init(c); return; }
  const rr=()=>{ save(); render(); };
  document.querySelectorAll('[data-cpq-req]').forEach(inp=>inp.onchange=()=>{ const k=inp.dataset.cpqReq; const v=inp.value===''?null:(inp.tagName==='SELECT'?inp.value:Math.max(0,+inp.value)); const R2=c.req;
    if(k==='sheet0'||k==='sheet1'){ R2.sheet=R2.sheet||[null,null]; R2.sheet[k==='sheet0'?0:1]=v; if(!R2.sheet[0]&&!R2.sheet[1]) R2.sheet=null; }
    else if(k==='fl'||k==='fw'){ R2.floor=R2.floor||{}; R2.floor[k==='fl'?'l':'w']=v; }
    else if(k==='plen'||k==='pkn'){ R2.part=R2.part||{}; R2.part[k==='plen'?'len':'kn']=v; }
    else { R2.tube=R2.tube||{}; R2.tube[{ttype:'type',tsize:'size',tlen:'len',twall:'wall',twt:'wt'}[k]]=v; }
    rr(); });
  document.querySelectorAll('[data-cpq-mat]').forEach(inp=>inp.onchange=()=>{ const x=c.req.mats[+inp.dataset.cpqMat]; if(inp.dataset.f==='m') x.m=inp.value; else x.t=inp.value===''?null:Math.max(0,+inp.value); rr(); });
  const sel=document.querySelector('[data-cpq-model]'); if(sel) sel.onchange=()=>{ c.model=sel.value; c.vi=0; c.pi=0; c.opts={}; c.auto=null; rr(); };
  const d=document.querySelector('[data-cpq-disc]'); if(d) d.onchange=()=>{ c.disc=Math.max(0,+d.value||0); const le=c.enq&&findEnq(c.enq); if(le&&le.cpq===c.id&&!le.snap) le.discount=c.disc; rr(); };
}
function actCpq(a,ds){
  const r=route(); const c=r[0]==='cpq'&&r[1]?cpqGet(r[1]):null; const rr=()=>{ save(); render(); };
  switch(a){
    case 'cpq-new': dlgCpqNew(); return true;
    case 'cpq-open-enq': { const e=findEnq(ds.id); const x=e.cpq&&cpqGet(e.cpq)||cpqFromEnquiry(e); if(!x){ toast('This machine type isn’t configurable yet'); return true; } location.hash='#/cpq/'+x.id+'/'+(x.model?'machine':'requirements'); toast('Configuration '+x.id+' linked to '+e.id); return true; }
    case 'cpq-mat-add': c.req.mats.push({m:Object.keys(MATS).find(k=>!c.req.mats.some(x=>x.m===k))||'ms',t:null}); rr(); return true;
    case 'cpq-mat-del': c.req.mats.splice(+ds.i,1); rr(); return true;
    case 'cpq-pick': c.model=ds.model; c.vi=+ds.vi; c.pi=+ds.pi; c.opts={}; if(c.auto&&!(CPQ_DB[c.model].auto||[]).includes(c.auto)) c.auto=null; save(); location.hash='#/cpq/'+c.id+'/machine'; return true;
    case 'cpq-vi': { c.vi=+ds.i; const v=CPQ_DB[c.model].variants[c.vi]; if(v.powers&&c.pi>=v.powers.length) c.pi=v.powers.length-1; if(c.auto&&autoFit(c.auto,v)==='nofit'){ c.auto=null; toast('Automation removed: it doesn’t fit this bed'); } rr(); return true; }
    case 'cpq-pi': c.pi=+ds.i; rr(); return true;
    case 'cpq-opt': c.opts=c.opts||{}; c.opts[ds.k]=!c.opts[ds.k]; rr(); return true;
    case 'cpq-auto': c.auto=ds.a||null; rr(); return true;
    case 'cpq-svc': c.svc[ds.k]=!c.svc[ds.k]; rr(); return true;
    case 'cpq-viewv': S.ui.cpqView=ds.v?+ds.v:null; rr(); return true;
    case 'cpq-save': { const p=cpqPricing(c); const v={id:c.id,v:c.versions.length+1,at:TODAY,label:cpqLabel(c),net:p.net,lines:p.ls.map(l=>({item:l.item,detail:l.detail,net:l.net})),specs:cpqSpecs(c),std:cpqStd(c)}; c.versions.push(v); S.ui.cpqView=null; rr(); toast('Version '+v.v+' saved'); return true; }
    case 'cpq-print': window.print(); return true;
    case 'cpq-link': { const id=$('#le').value; const e=findEnq(id); if(e.cpq){ toast(id+' already has a configuration'); return true; } c.enq=id; e.cpq=c.id; rr(); toast('Linked to '+id); return true; }
  }
  return false;
}

    {k:'power',t:'Electrical supply confirmed',d:'Supply rating confirmed by customer'},
    {k:'slot',t:'Supply route confirmed',d:'Stock at Charleville-Mézières hub or build slot reserved'}
  ].map(x=>({...x,ok:!!ck[x.k]}));
  return {auto,manual,done: auto.every(a=>a.ok) && manual.every(x=>x.ok)};
}
function supplyFor(e){
  const {m,c}=cfgOf(e); const plant=PLANTS[c.plant]; const stock=MACHINE_STOCK.find(s=>s.model===m.id);
  const free = stock? stock.avail-stock.alloc : 0;
  const lead = free>0? 3 : (c.plant==='CDL'? 9 : 12);
  return {plant,stock,free,lead,delivery:addDays(TODAY,lead*7)};
}
function orderRisk(o){
  const b=buildFor(o.id);
  if(b && b.risk!=='ok') return {lvl:b.risk, why:b.reason, slip:dayDiff(b.due,b.pred)};
  if(o.status==='In transit') { const sh=SHIPMENTS.find(s=>s.order===o.id); if(sh && sh.arrive>o.promise) return {lvl:'warn',why:'Arrives '+dt(sh.arrive)+', after promised '+dt(o.promise)+'.',slip:dayDiff(o.promise,sh.arrive)}; }
  return {lvl:'ok',why:'',slip:0};
}

function openLayer(kind, html, onMount){

  L.innerHTML=`<div class="scrim"></div><div class="${kind}" role="dialog" aria-modal="true">${html}</div>`;

  sc.onclick=closeLayer; L.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeLayer);
  document.onkeydown=e=>{ if(e.key==='Escape') closeLayer(); };
  onMount && onMount(p);

}
function closeLayer(){
  const L=$('#layer'); const sc=L.querySelector('.scrim'), p=L.querySelector('.drawer,.dialog');

function compRisk(e){
  const {m,cfg}=cfgOf(e); const stem=m.name.split('-')[0];
  return COMPONENTS.filter(c=>(c.use.includes(stem)||c.use==='All models') && (!/kW/.test(c.part) || (cfg.power && c.part.includes(cfg.power+' kW'))));
}
function Insights(e,sk){
  const out=[]; const {m,c,cfg}=cfgOf(e); const sup=supplyFor(e);
  const hist=HIST_QUOTES.filter(q=>MODEL[q.model] && MODEL[q.model].cat===m.cat);
  const risky=compRisk(e).filter(x=>x.dos<21);
  if(sk==='enquiry'){
    const miss=Object.entries(e.req).filter(([k,v])=>v.conf==='missing').map(([k])=>k.toLowerCase());
    if(miss.length) out.push({lvl:'warn',t:`${miss.length} requirement${miss.length>1?'s':''} missing from the email`,d:`No ${miss.join(', ')}. Ask now so configuration isn\u2019t blocked later.`});
    if(sup.free>0) out.push({lvl:'ok',t:`A matching ${m.name} is free in hub stock`,d:`${esc(sup.stock.cfg)} at Charleville-Mézières. Quoting from stock cuts lead time to about ${sup.lead} weeks.`,href:'#/supply/machines',cta:'View stock'});
    const lostSame=HIST_QUOTES.filter(q=>q.model===m.id&&q.status==='Lost');
    lostSame.forEach(q=>out.push({lvl:'warn',t:`${q.id} for ${m.name} was lost on ${q.note.toLowerCase()}`,d:`${esc(CUST[q.cust].name)}, ${dt(q.date)}. Lead that concern in the first reply.`}));
  }
  if(sk==='configuration'){
    const p=pricing(e); const top=p.ls.slice().sort((a,b)=>b.net-a.net)[0];
    out.push({lvl:'ok',t:`${esc(top.item)} is ${(top.net/p.net*100).toFixed(0)}% of the value`,d:`Options and services add ${gbp(p.net-top.net)}. Changes to the machine line move the price most.`});
    if(cfg.auto && m.auto) out.push({lvl:'ok',t:`Automation is listed for ${m.name}`,d:`AMADA publishes ${c.automation.toLowerCase()} for this model.`});
    risky.forEach(x=>out.push({lvl:x.dos<10?'crit':'warn',t:`${esc(x.part)} has ${x.dos} days of cover`,d:`Every ${m.name} build at this spec uses one. Next delivery ${dt(x.eta)}.`,href:'#/supply/components',cta:'Components'}));
  }
  if(sk==='feasibility'){
    if(sup.plant){ const wc=WORKCENTRES[sup.plant.id].filter(w=>w[2]>=90); wc.forEach(w=>out.push({lvl:w[2]>=95?'crit':'warn',t:`${w[0]} at ${sup.plant.name} is ${w[2]}% loaded`,d:`A new build would queue here. Keep ${sup.lead} weeks unless stock is used.`,href:'#/production/workcentres',cta:'Work centres'})); }
    risky.forEach(x=>out.push({lvl:x.dos<10?'crit':'warn',t:`${esc(x.part)} is short`,d:`${x.onhand} on hand, ${x.need} needed in 4 weeks, next arrival ${dt(x.eta)}.`,href:'#/supply/components',cta:'Components'}));
  }
  if(sk==='pricing'||sk==='approval'){
    const p=pricing(e); const RL=S.md.rules;
    if(p.margin<RL.minMargin) out.push({lvl:'crit',t:`Margin ${p.margin.toFixed(1)}% is below the ${RL.minMargin}% floor`,d:`Reduce the discount or remove low-margin services.`});
    else out.push({lvl:'ok',t:`Margin ${p.margin.toFixed(1)}% clears the ${RL.minMargin}% floor`,d:`Discount could reach ${Math.max(0,(100*(1-p.cost/(p.list*(1-RL.minMargin/100))))).toFixed(1)}% before hitting it.`});
    const lost=hist.filter(q=>q.status==='Lost'); const won=hist.filter(q=>q.status==='Won');
    if(hist.length) out.push({lvl:lost.length>won.length?'warn':'ok',t:`${c.name}: ${won.length} won, ${lost.length} lost in the last 90 days`,d: lost.length? `Lost on ${lost.map(q=>q.note.toLowerCase()).join(' and ')}. ${lost.some(q=>q.note==='Lead time')?'Lead time mattered more than price.':''}` : 'No recent losses in this category.'});
  }
  if(sk==='proposal'&&!e.sent){
    const need=['Floor layout drawing','Sample test report'].filter(k=>!(e.files||[]).find(f=>f.kind===k));
    if(need.length) out.push({lvl:'warn',t:`${need.join(' and ')} not attached`,d:'Quotes with a layout and test report answer the two most common follow-up questions.'});
  }
  if(sk==='proposal'&&e.snap) out.push({lvl:'ok',t:'Prices are locked to what was sent',d:`Master data changes after ${dtl(e.sent)} don\u2019t alter this quote.`});
  if(sk==='handoff'&&!e.order) out.push({lvl:'ok',t:sup.free>0?'Order will reserve hub stock':'Order will open a build at '+(sup.plant?sup.plant.name:'the plant'),d:`Earliest delivery ${dtl(sup.delivery)}. The PO is checked against the accepted quote value.`});
  return out.slice(0,3);
}

  } else if(tab==='rules'){

/* Rule-based extraction (an LLM would do this in production; rules keep the demo deterministic) */
function extract(t){
  const s=t.toLowerCase(); const req={}; let model=null, range=0, power=null, auto=false;
  const size=t.match(/(\d{4})\s*[x×]\s*(\d{4})/); if(size) req['Sheet size']=R(size[1]+' × '+size[2]+' mm','high');
  const kw=t.match(/(\d{1,2})\s?kw/i); if(kw){ power=+kw[1]; req['Laser power']=R('~'+kw[1]+' kW requested','high'); }
  const mats=['mild steel','stainless','aluminium','aluminum','copper','brass','galvanised'].filter(m=>s.includes(m)); req['Materials']= mats.length? R(mats.join(', '),'high') : R('Not stated','missing');
  if(/tower|automation|loading|unloading|lights-out|lights out/.test(s)){ auto=true; req['Automation']=R('Requested','high'); }
  const ms=Object.values(MODEL);
  const full=ms.find(m=>s.includes(m.name.toLowerCase())); if(full) model=full.id;
  if(!model){ const hit=ms.find(m=>{ const stem=m.name.toLowerCase().split(/[- ]/)[0]; return stem.length>=3 && new RegExp('\\b'+stem+'\\b').test(s); }); if(hit) model=hit.id; }
  if(!model){
    if(/tube|profile|angle|channel/.test(s)) model='ensis-rie';
    else if(/weld/.test(s)) model='flw-ensise';
    else if(/robot/.test(s)&&/bend/.test(s)) model='egb-arce';
    else if(/tool chang|atc/.test(s)) model='hg-atc';
    else if(/press brake|bend/.test(s)) model= /servo|electric/.test(s)?'egb-e':'hg';
    else if(/combination|punch.*laser|laser.*punch/.test(s)) model='acies-aje';
    else if(/punch|turret/.test(s)) model='em-zre';
    else if(/laser|fibre|fiber|cut/.test(s)) model = power && power>8 ? 'ensis-aje' : (/compact|small|prototype/.test(s)?'brevis-aj':'orsus-aje');
  }
  if(model&&MODEL[model].ranges&&size){ const i=MODEL[model].ranges.findIndex(r=>+size[1]<=r[0]&&+size[2]<=r[1]); range=i<0?0:i; }
  if(model&&MODEL[model].power&&power){ const p=MODEL[model].power; if(power<p[0]||power>p[1]) req['Laser power'].conf='med'; }
  if(!model) model=null;
  req['Floor space and power']=R('Not stated','missing');
  return {req,model,range,power,auto};
}

function bind(r){
  document.querySelectorAll('[data-href]').forEach(el=>el.addEventListener('click',ev=>{ const inner=ev.target.closest('a,button,input,select,label,textarea'); if(inner && inner!==el && el.contains(inner)) return; location.hash=el.dataset.href; }));
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ S.ui.enqFilter=b.dataset.filter; save(); render(); });
  const q=$('#q'); if(q){ q.oninput=()=>{ S.ui.q=q.value; const pos=q.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); }; }
  document.querySelectorAll('[data-plant-set]').forEach(b=>b.onclick=()=>{ S.ui.plant=b.dataset.plantSet; save(); render(); });
  document.querySelectorAll('[data-plant]').forEach(a=>a.addEventListener('click',()=>{ S.ui.plant=a.dataset.plant; save(); }));
  document.querySelectorAll('[data-build]').forEach(el=>el.onclick=()=>dlgBuild(el.dataset.build));
  document.querySelectorAll('[data-ship]').forEach(el=>el.onclick=()=>dlgShip(el.dataset.ship));
  document.querySelectorAll('[data-cust]').forEach(el=>el.onclick=()=>dlgCustomer(el.dataset.cust));
  document.querySelectorAll('[data-bind]').forEach(el=>el.onchange=()=>{ const e=findEnq(el.dataset.id); e[el.dataset.bind]=el.value||null; save(); render(); toast(el.dataset.bind==='owner'?(el.value?'Assigned to '+el.value:'Owner removed'):'Priority set to '+el.value); });
  document.querySelectorAll('[data-cfg]').forEach(el=>el.onchange=()=>{ const e=findEnq(el.dataset.id); cfgOf(e); e.cfg[el.dataset.cfg]= el.dataset.cfg==='variant'? el.value : +el.value; save(); render(); });
  document.querySelectorAll('[data-cfgt]').forEach(el=>el.onclick=()=>{ const e=findEnq(el.dataset.id); cfgOf(e); e.cfg[el.dataset.cfgt]=!e.cfg[el.dataset.cfgt]; save(); render(); });
  document.querySelectorAll('[data-chk]').forEach(el=>{ const f=()=>{ const e=findEnq(el.dataset.id); e.checks=e.checks||{}; e.checks[el.dataset.chk]=!e.checks[el.dataset.chk]; save(); render(); }; el.onclick=f; el.onkeydown=ev=>{ if(ev.key===' '||ev.key==='Enter'){ev.preventDefault();f();} }; });
  const d=document.querySelector('[data-disc]'); if(d){ d.onchange=()=>{ const e=findEnq(d.dataset.disc); e.discount=Math.max(0,+d.value||0); save(); render(); }; }
  const cm=$('#cm'); if(cm){ cm.onchange=()=>{ const e=findEnq(r[1]); e.comment=cm.value; save(); }; }
  document.querySelectorAll('[data-file]').forEach(inp=>inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const e=findEnq(inp.dataset.id); e.files=(e.files||[]).filter(x=>x.kind!==inp.dataset.file).concat({kind:inp.dataset.file,name:f.name}); save(); render(); toast(inp.dataset.file+' attached'); });
  document.querySelectorAll('[data-md-price]').forEach(inp=>inp.onchange=()=>{ const k=inp.dataset.mdPrice, i=inp.dataset.i; const v=Math.max(0,Math.round(+inp.value||0)); const P=S.md.prices; const old= i!==undefined? P[k][+i] : P[k];
    if(v===old) return; if(i!==undefined) P[k][+i]=v; else P[k]=v;
    const name=(MODEL[k]?MODEL[k].name+(i==='1'?' per kW':' base'):({auto_laser:'Laser automation',auto_punch:'Punching automation',software:'Software seat',install:'Delivery and installation',training:'Training courses'})[k]);
    mdLog(name,gbp(old),gbp(v)); save(); const n=S.enq.filter(e=>e.stage<7&&!e.snap&&(MODEL[k]?e.match.model===k:true)).length; render(); toast(`${name} updated, ${n} open enquir${n===1?'y':'ies'} repriced`); });
  document.querySelectorAll('[data-md-rule]').forEach(inp=>inp.onchange=()=>{ const k=inp.dataset.mdRule; const v=Math.max(0,+inp.value||0); const old=S.md.rules[k]; if(v===old) return; S.md.rules[k]=v; mdLog(inp.getAttribute('aria-label'),old+'%',v+'%'); save(); render(); toast('Rule updated across all open enquiries'); });
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); act(b.dataset.act,b.dataset); });
  bindCpq(r);
  document.querySelectorAll('[data-md-cpq]').forEach(inp=>inp.onchange=()=>{ const [g,k]=inp.dataset.mdCpq.split('|'); const P=S.md.prices[g]; const old=P[k]; const v=Math.max(0,Math.round(+inp.value||0)); if(v===old) return; P[k]=v; mdLog(inp.getAttribute('aria-label'),gbp(old),gbp(v)); save(); render(); toast(inp.getAttribute('aria-label')+' updated'); });
}
function act(a,ds){
  if(actCpq(a,ds)) return;
  const e=ds.id?findEnq(ds.id):null;
  switch(a){
    case 'new-enq': dlgNewEnq(); break;
    case 'clarify': dlgClarify(e); break;
    case 'advance': { const i=+ds.idx; e.stage=Math.max(e.stage,i+1); e.hoursIn=0; save(); location.hash='#/enquiries/'+e.id+'/'+STAGES[i+1].key; toast(STAGES[i].label+' complete'); break; }
    case 'approve': { e.approvals=e.approvals||{}; e.approvals[ds.who]=true; save(); render(); toast('Approved'); break; }
    case 'send-quote': { const missing=['Floor layout drawing','Sample test report'].filter(k=>!(e.files||[]).find(f=>f.kind===k)); if(missing.length && !confirm('Send without: '+missing.join(', ')+'?')) return; e.snap=pricing(e); e.sent=TODAY; save(); render(); toast('Quote sent to '+e.contact); break; }
    case 'accept': { e.accepted=TODAY; e.stage=6; save(); location.hash='#/enquiries/'+e.id+'/handoff'; toast('Moved to order handoff'); break; }
    case 'lost': { if(!confirm('Mark this quote as lost?')) return; HIST_QUOTES.unshift({id:e.id.replace('ENQ','QT'),cust:e.cust,model:e.match.model,value:pricing(e).net,status:'Lost',date:TODAY,note:'Recorded by sales'}); S.enq=S.enq.filter(x=>x.id!==e.id); save(); location.hash='#/quotes'; toast('Marked as lost'); break; }
    case 'create-order': {
      const f=$('#poForm'); const g=n=>f.elements[n].value.trim(); const errs=[];
      ['pono','podate','poval','deliv','site'].forEach(n=>{ f.elements[n].classList.toggle('bad',!g(n)); if(!g(n)) errs.push(n); });
      const p=pricing(e); const val=+g('poval'); const diff=Math.abs(val-p.net)/p.net;
      let msg=''; if(errs.length) msg='Fill in the highlighted fields.'; else if(diff>0.005){ msg='PO value differs from the accepted quote by '+gbp(Math.abs(val-p.net))+'. Check with the customer before release.'; f.elements.poval.classList.add('bad'); }
      if(msg){ $('#poErr').innerHTML=`<span class="err">${msg}</span>`; return; }
      const sup=supplyFor(e); const {m,c}=cfgOf(e); const n=Math.max(...S.orders.map(o=>+o.id.slice(-4)))+1; const oid='SO-2026-'+String(n).padStart(4,'0');
      const fromStock=sup.free>0; const plant=c.plant||'CHV';
      S.orders.unshift({id:oid,cust:e.cust,model:m.id,config:lines(e)[0].item+(lines(e)[0].detail?', '+lines(e)[0].detail.replace('Working range ',''):''),value:val,plant,po:g('podate'),promise:g('deliv'),status:fromStock?'Allocated from stock':'In build'});
      if(fromStock){ sup.stock.alloc++; } else { const bn=Math.max(...S.builds.map(b=>+b.id.slice(-4)))+1; S.builds.unshift({id:'BO-26-'+bn,order:oid,plant,stage:0,start:addDays(TODAY,7),due:addDays(g('deliv'),-10),pred:addDays(g('deliv'),-10),risk:'ok',reason:''}); }
      e.order=oid; e.po={pono:g('pono')}; e.stage=7; save(); render(); toast(oid+' created'); break; }
    case 'draft-notice': dlgNotice(ds.order); break;
    case 'raise-po': toast('Purchase request raised: '+ds.qty+' × '+ds.part); break;
    case 'apply-rec': { if(ds.id==='swap'){ const b1=S.builds.find(b=>b.id==='BO-26-1142'), b2=S.builds.find(b=>b.id==='BO-26-1144'); b1.risk='ok'; b1.pred=b1.due; b1.reason=''; b2.risk='warn'; b2.pred=addDays(b2.due,6); b2.reason='Oscillator module reassigned to BO-26-1142; waits for 5 Oct delivery.'; save(); render(); toast('Module swapped, SO-2026-0412 back on plan'); } break; }
  }
}

try{ vsMount(); }catch(err){ console.error(err); }
try{ render(); }
catch(err){ console.error('Recovering from saved data', err); S=fresh(); boot(); save(); render(); setTimeout(()=>toast('Saved demo data was out of date and has been reset'),300); }
</script>
